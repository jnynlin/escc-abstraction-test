<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESCC 病歷摘錄工作台</title>
<!-- secure copy 2026-09-28: accounts + AES-GCM encryption at rest (IndexedDB) + auto-lock + role-gated exports; SCHEMA/RULES identical to the original -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F6F7F5; --sheet:#FFFFFF; --ink:#1E2A32; --soft:#5E6C74; --rule:#D8DEDA; --well:#EEF1EE;
  --done:#1F6B5C; --done-soft:#E1EFEA; --iodine:#8A5A14; --iodine-soft:#F6EBD8;
  --err:#B42318; --err-soft:#FCEBE9; --focus:#2F6FA3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181C; --sheet:#1A2227; --ink:#E4EAEC; --soft:#97A6AD; --rule:#2F3B41; --well:#151D21;
    --done:#6CC3AC; --done-soft:#17302A; --iodine:#E0B56C; --iodine-soft:#33291A;
    --err:#F2877C; --err-soft:#3A1F1C; --focus:#7FB4E0;
  }
}
:root[data-theme="dark"]{
  --paper:#12181C; --sheet:#1A2227; --ink:#E4EAEC; --soft:#97A6AD; --rule:#2F3B41; --well:#151D21;
  --done:#6CC3AC; --done-soft:#17302A; --iodine:#E0B56C; --iodine-soft:#33291A;
  --err:#F2877C; --err-soft:#3A1F1C; --focus:#7FB4E0;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

/* bar */
.bar{position:sticky;top:0;z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top,0px) + 9px) 16px 9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.bar h1{margin:0;font-size:1rem;font-weight:600;letter-spacing:.01em;}
.bar .sp{flex:1;}
.bar label{font-size:.82rem;color:var(--soft);}
.bar input{width:120px;padding:6px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.bar input.need{border-color:var(--err);background:var(--err-soft);}
.btn{padding:6px 12px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);font-size:.86rem;font-weight:500;white-space:nowrap;}
.btn.go{background:var(--done);border-color:var(--done);color:#fff;}
:root[data-theme="dark"] .btn.go{color:#0E1714;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#0E1714;}}
.btn.warn{color:var(--err);border-color:var(--err);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.menu{position:relative;}
.menu .dd{position:absolute;right:0;top:calc(100% + 4px);min-width:230px;background:var(--sheet);border:1px solid var(--rule);
  border-radius:7px;padding:4px;display:none;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.14);}
.menu.open .dd{display:block;}
.menu .dd button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:5px;font-size:.88rem;}
.menu .dd button:hover{background:var(--well);}
.menu .dd hr{border:none;border-top:1px solid var(--rule);margin:4px 0;}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px);}
@media (max-width:880px){.shell{grid-template-columns:1fr;}}
.rail{border-right:1px solid var(--rule);background:var(--sheet);padding:14px 14px 20px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);height:calc(100vh - 53px);display:flex;flex-direction:column;overflow:hidden;}
@media (max-width:880px){.rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);}}
.meter{margin:0 0 12px;}
.meter .row{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft);margin-bottom:4px;}
.meter .row b{color:var(--ink);font-weight:600;}
.track{height:6px;border-radius:3px;background:var(--well);overflow:hidden;}
.track i{display:block;height:100%;background:var(--done);width:0;transition:width .3s;}
@media (prefers-reduced-motion: reduce){.track i{transition:none;}}
.queues{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px;}
.queues button{border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:3px 10px;font-size:.78rem;color:var(--soft);}
.queues button.on{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--well);}
.queues button span{margin-left:4px;color:var(--soft);font-weight:400;}
.rail input.q{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);margin-bottom:8px;}
.list{overflow:auto;flex:1;margin:0 -6px;padding:0 6px;}
@media (max-width:880px){.list{max-height:240px;}}
.pt{display:grid;grid-template-columns:auto 1fr auto;gap:0 9px;align-items:center;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:6px;padding:7px 8px;}
.pt:hover{background:var(--well);}
.pt.cur{border-color:var(--ink);background:var(--well);}
.pt .dots{display:flex;gap:3px;}
.pt .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);}
.pt .dots i.s1{background:var(--iodine);} .pt .dots i.s2{background:var(--done);} .pt .dots i.bad{background:var(--err);}
.pt b{font-weight:600;font-size:.9rem;}
.pt small{color:var(--soft);font-size:.76rem;}
.empty{color:var(--soft);font-size:.88rem;padding:18px 4px;}
.legend{font-size:.72rem;color:var(--soft);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}

/* main */
main{padding:18px 22px 130px;max-width:1040px;width:100%;}
@media (max-width:600px){main{padding:14px 12px 150px;}}
.spine{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:6px;padding:12px 16px;margin-bottom:14px;}
.spine h2{margin:0 0 6px;font-size:1.25rem;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.spine h2 small{font-size:.82rem;font-weight:400;color:var(--soft);}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;margin:0;}
.facts div{min-width:0;}
.facts dt{font-size:.72rem;color:var(--soft);}
.facts dd{margin:0;font-size:.9rem;font-weight:500;overflow-wrap:anywhere;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto;}
.tabs button{border:none;background:none;padding:9px 12px;font-size:.88rem;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600;}
.tabs button i{width:7px;height:7px;border-radius:50%;background:var(--rule);}
.tabs button i.s1{background:var(--iodine);} .tabs button i.s2{background:var(--done);}
.tabs button em{font-style:normal;font-size:.74rem;color:var(--soft);}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:4px 18px 10px;}
.sheet h3{font-size:.92rem;font-weight:600;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule);color:var(--ink);}
.sheet h3:first-child{border-top:none;padding-top:4px;}
.desc{font-size:.86rem;color:var(--soft);margin:10px 0 4px;}
.f{padding:7px 0;display:grid;grid-template-columns:minmax(160px,34%) 1fr;gap:4px 16px;align-items:start;}
@media (max-width:640px){.f{grid-template-columns:1fr;}}
.f > .lab{font-size:.88rem;padding-top:5px;}
.f > .lab i{color:var(--err);font-style:normal;margin-left:3px;}
.f > .lab small{display:block;color:var(--soft);font-size:.74rem;line-height:1.4;margin-top:2px;}
.f .in{min-width:0;}
.f input[type=text],.f select,.f textarea{width:100%;max-width:340px;padding:6px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.f textarea{max-width:none;min-height:64px;resize:vertical;}
.f .hint{font-size:.76rem;color:var(--soft);margin-top:3px;}
.f .msg{font-size:.78rem;margin-top:3px;}
.f .msg:empty,.f .hint:empty{display:none;}
.f.e .msg{color:var(--err);} .f.e input,.f.e select,.f.e .opts{border-color:var(--err);}
.f.w .msg{color:var(--iodine);}
.f.flash{animation:fl 1.1s ease;}
@keyframes fl{0%,40%{background:var(--iodine-soft);}100%{background:transparent;}}
@media (prefers-reduced-motion: reduce){.f.flash{animation:none;}}
.opts{display:flex;flex-wrap:wrap;gap:5px;border:1px solid transparent;border-radius:6px;}
.opts button{border:1px solid var(--rule);background:var(--well);border-radius:5px;padding:5px 10px;font-size:.86rem;text-align:left;}
.opts button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet);}
.calc{padding:6px 9px;border:1px dashed var(--rule);border-radius:5px;min-height:34px;max-width:340px;font-weight:600;}
.calc:empty::before{content:"—";color:var(--soft);font-weight:400;}
.inst{border:1px solid var(--rule);border-radius:6px;margin:12px 0;background:var(--sheet);}
.inst > .ih{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--well);border-radius:6px 6px 0 0;}
.inst > .ih b{font-weight:600;font-size:.9rem;}
.inst > .ih span{color:var(--soft);font-size:.82rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inst > .ib{padding:4px 14px 8px;}
.addrow{margin:10px 0 4px;}
.nodata{padding:40px 10px;text-align:center;color:var(--soft);}
.nodata h2{color:var(--ink);font-size:1.1rem;font-weight:600;margin:0 0 8px;}
.nodata ol{text-align:left;display:inline-block;margin:10px 0 16px;}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--rule);
  padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));}
.dock .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1340px;margin:0 auto;}
.dock .st{font-size:.84rem;color:var(--soft);}
.dock .st b{color:var(--ink);font-weight:600;}
.pill{border:none;border-radius:12px;padding:3px 10px;font-size:.8rem;font-weight:600;}
.pill.e{background:var(--err-soft);color:var(--err);} .pill.w{background:var(--iodine-soft);color:var(--iodine);} .pill.ok{background:var(--done-soft);color:var(--done);}
.dock .sp{flex:1;}
.issues{max-width:1340px;margin:6px auto 0;max-height:32vh;overflow:auto;display:none;}
.issues.open{display:block;}
.issues button{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--rule);padding:6px 2px;font-size:.84rem;}
.issues button b{margin-right:6px;}
.issues button.e b{color:var(--err);} .issues button.w b{color:var(--iodine);}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:16px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;}
#toast.show{opacity:1;}
#modal{position:fixed;inset:0;background:rgba(10,18,22,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:18px;}
#modal.open{display:flex;}
#modal .box{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;max-width:460px;width:100%;}
#modal p{margin:0 0 14px;white-space:pre-line;}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;}
input[type=file]{display:none;}

.bar select{padding:6px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.meter .row span b{color:var(--ink);font-weight:600;}
.pt small.tag{font-size:.72rem;}
.pt small.tag.opn{color:var(--iodine);font-weight:600;}
.pt small.tag.ret{color:var(--err);font-weight:600;}
.banner{border-radius:6px;padding:9px 14px;margin:-4px 0 14px;font-size:.86rem;}
.banner.ok{background:var(--done-soft);color:var(--done);}
.banner.aud{background:var(--iodine-soft);color:var(--iodine);}
.tabs b.qn{background:var(--iodine);color:var(--sheet);border-radius:9px;font-size:.7rem;padding:0 6px;font-weight:600;}
.qbtn{display:inline-block;margin-top:5px;border:1px dashed var(--rule);background:none;border-radius:10px;padding:1px 9px;font-size:.72rem;color:var(--soft);}
.qbtn:hover{border-color:var(--iodine);color:var(--iodine);}
.qbtn.on{border-style:solid;border-color:var(--iodine);color:var(--iodine);font-weight:600;}
.f.hasq{background:linear-gradient(90deg,var(--iodine-soft),transparent 60%);margin:0 -18px;padding-left:18px;padding-right:18px;}
.qbox{margin-top:8px;border-left:3px solid var(--iodine);background:var(--well);border-radius:0 6px 6px 0;padding:8px 12px;font-size:.84rem;max-width:560px;}
.qbox.ret{border-left-color:var(--err);}
.qbox.closed{border-left-color:var(--done);opacity:.85;}
.qbox .qh{font-weight:600;margin-bottom:4px;}
.qbox ul{margin:0;padding-left:18px;}
.qbox li{margin:2px 0;}
.qbox li small{display:block;color:var(--soft);font-size:.72rem;}
.qacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.srcrow{background:var(--well);border-radius:6px;padding:7px 10px !important;margin:2px 0 6px;}
.srcin{display:flex;gap:8px;flex-wrap:wrap;}
.srcin select{max-width:200px !important;}
.srcin input{max-width:190px !important;}
.small{font-size:.8rem;margin-top:14px;}
#modal .box h3{margin:0 0 10px;font-size:1rem;}
.mf{display:block;margin:0 0 10px;}
.mf span{display:block;font-size:.82rem;color:var(--soft);margin-bottom:3px;}
.mf i{color:var(--err);font-style:normal;}
.mf select,.mf input,.mf textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.mf textarea{min-height:70px;resize:vertical;}
.merr{color:var(--err);font-size:.82rem;margin:0 0 8px;min-height:0;}
.merr:empty{display:none;}
.report .tw{overflow-x:auto;}
.report table{border-collapse:collapse;width:100%;font-size:.86rem;margin:6px 0 14px;}
.report th,.report td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;}
.report th{color:var(--soft);font-weight:500;}
.report tr.lo td{color:var(--err);}
body[data-role="physician"] .bar{border-bottom:3px solid var(--done);}
body[data-role="auditor"] .bar{border-bottom:3px solid var(--iodine);}
.chip{font-size:.84rem;color:var(--soft);} .chip b{color:var(--ink);font-weight:600;}
#auth{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;}
#auth[hidden]{display:none!important;}
.abox{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:22px 24px;max-width:420px;width:100%;}
.abox h2{margin:0 0 4px;font-size:1.15rem;font-weight:600;} .asub{margin:0 0 16px;color:var(--soft);font-size:.9rem;}
.aerr{color:var(--err);font-size:.86rem;min-height:1.2em;margin:8px 0 0;} .afoot{color:var(--soft);font-size:.76rem;margin:14px 0 0;}
.adesc{font-size:.88rem;margin:0 0 10px;} .rcode{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem;letter-spacing:.04em;background:var(--well);border:1px dashed var(--rule);border-radius:6px;padding:10px;word-break:break-all;user-select:all;}
.ck{display:flex;gap:8px;align-items:center;margin:10px 0 12px;font-size:.88rem;}
.alinks{margin:14px 0 0;display:flex;gap:14px;flex-wrap:wrap;} .lk{background:none;border:none;padding:0;color:var(--focus);font-size:.84rem;text-decoration:underline;}
.testban{margin:12px 0 0;padding:8px 10px;border-radius:6px;background:var(--err-soft);color:var(--err);font-size:.86rem;font-weight:600;}
.testchip{font-size:.78rem;font-weight:600;color:var(--err);border:1px solid var(--err);border-radius:10px;padding:1px 8px;}
</style>
</head>
<body>
<div class="bar">
  <h1>ESCC 病歷摘錄工作台</h1>
  <span class="sp"></span>
  <input id="who" type="hidden"><select id="role" hidden><option value="abstractor">登錄人員</option><option value="physician">醫師</option><option value="auditor">稽核員</option></select>
  <span class="testchip">測試版・勿輸入真實資料</span><span class="chip" id="chip"></span><button class="btn" type="button" id="bAssign" hidden>分派病人</button><button class="btn" type="button" id="bUsers" hidden>帳號管理</button><button class="btn" type="button" id="bPw">變更密碼</button><button class="btn" type="button" id="bLock">鎖定</button>
  <div class="menu" id="menu">
    <button class="btn" type="button" id="bMenu" aria-haspopup="true">資料 ▾</button>
    <div class="dd" role="menu">
      <button type="button" data-act="load">載入預填檔（CSV）</button>
      <hr>
      <button type="button" data-act="qout">匯出待醫師確認問題（CSV）</button>
      <button type="button" data-act="qin">匯入醫師回覆（CSV）</button>
      <hr>
      <button type="button" data-act="sample">稽核：隨機抽樣 5%</button>
      <button type="button" data-act="report">稽核：一致性報告</button>
      <hr>
      <button type="button" data-act="redcapx">匯出 REDCap 匯入檔（可直接上傳）</button>
      <button type="button" data-act="redcap">匯出 REDCap 原始檔（備查，不可直接上傳）</button>
      <button type="button" data-act="srcs">匯出來源文件清單（CSV）</button>
      <button type="button" data-act="backup">匯出完整備份（JSON）</button>
      <button type="button" data-act="restore">還原備份（JSON）</button>
    </div>
  </div>
</div>
<div class="shell">
  <aside class="rail" aria-label="病人清單">
    <div class="meter"><div class="row"><span id="m1"></span></div><div class="track"><i id="tCore"></i></div></div>
    <div class="meter"><div class="row"><span id="m2"></span></div></div>
    <div class="queues" id="queues"></div>
    <input class="q" id="q" placeholder="搜尋研究編號" autocomplete="off">
    <div class="list" id="list"></div>
    <div class="legend"><span><i style="background:var(--rule)"></i>未開始</span><span><i style="background:var(--iodine)"></i>進行中</span><span><i style="background:var(--done)"></i>完成</span><span><i style="background:var(--err)"></i>有錯誤</span></div>
  </aside>
  <main id="main"></main>
</div>
<div class="dock" id="dock" hidden>
  <div class="row">
    <button type="button" class="pill ok" id="pE">待處理 0</button>
    <button type="button" class="pill ok" id="pW">提醒 0</button>
    <span class="st" id="stTxt"></span>
    <span class="sp"></span>
    <button class="btn" type="button" id="bDone">標記此表單完成</button>
    <button class="btn go" type="button" id="bSign" hidden>簽核此病人</button>
    <button class="btn go" type="button" id="bNext">下一位 ›</button>
  </div>
  <div class="issues" id="issues"></div>
</div>
<div id="auth" hidden><div class="abox"><h2>ESCC 病歷摘錄工作台</h2><p class="asub" id="aSub"></p><div id="aBody"></div><p class="aerr" id="aErr" role="alert"></p><p class="afoot">資料以帳號密碼加密存在這台電腦的瀏覽器中；閒置 15 分鐘自動鎖定。</p><p class="testban">測試版：僅供試用，請勿輸入任何真實病人資料。</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><div id="mBody"></div><div class="acts"><button class="btn" type="button" id="mNo">取消</button><button class="btn go" type="button" id="mYes">確定</button></div></div></div>
<input type="file" id="fCsv" accept=".csv,text/csv">
<input type="file" id="fJson" accept=".json,application/json">
<script>

/* ---------- REDCap logic evaluator ---------- */
function tokenize(s){
  var re=/\s*(\[[a-z0-9_]+(?:\(\d+\))?\]|'[^']*'|"[^"]*"|\d+(?:\.\d+)?|<>|<=|>=|=|<|>|\+|-|\*|\/|\(|\)|,|[A-Za-z_]+)/g,t=[],m,last=0;
  while((m=re.exec(s))){ if(m.index!==last&&s.slice(last,m.index).trim())throw new Error("語法："+s); t.push(m[1]); last=re.lastIndex; }
  if(s.slice(last).trim())throw new Error("語法："+s);
  return t;
}
function parse(s){
  var t=tokenize(s),i=0;
  function peek(){return t[i];} function next(){return t[i++];}
  function lower(x){return x&&x.toLowerCase();}
  function expr(){return or_();}
  function or_(){var a=and_();while(lower(peek())==="or"){next();a={o:"or",a:a,b:and_()};}return a;}
  function and_(){var a=cmp();while(lower(peek())==="and"){next();a={o:"and",a:a,b:cmp()};}return a;}
  function cmp(){var a=add();var p=peek();if(["=","<>","<",">","<=",">="].indexOf(p)>=0){next();a={o:p,a:a,b:add()};}return a;}
  function add(){var a=mul();while(peek()==="+"||peek()==="-"){var o=next();a={o:o,a:a,b:mul()};}return a;}
  function mul(){var a=un();while(peek()==="*"||peek()==="/"){var o=next();a={o:o,a:a,b:un()};}return a;}
  function un(){if(peek()==="-"){next();return {o:"neg",a:un()};}return prim();}
  function prim(){
    var x=next();
    if(x===undefined)throw new Error("運算式不完整："+s);
    if(x==="("){var e=expr();if(next()!==")")throw new Error("缺右括號："+s);return e;}
    if(x[0]==="["){var m=/^\[([a-z0-9_]+)(?:\((\d+)\))?\]$/.exec(x);return m[2]!==undefined?{o:"cb",v:m[1],c:m[2]}:{o:"var",v:m[1]};}
    if(x[0]==="'"||x[0]==='"')return {o:"lit",v:x.slice(1,-1)};
    if(/^\d/.test(x))return {o:"lit",v:x};
    var lx=x.toLowerCase();
    if(lx==="true")return {o:"lit",v:true}; if(lx==="false")return {o:"lit",v:false};
    if(["if","round","datediff"].indexOf(lx)>=0){
      if(next()!=="(")throw new Error("函式語法："+s);
      var args=[];if(peek()!==")"){args.push(expr());while(peek()===","){next();args.push(expr());}}
      if(next()!==")")throw new Error("缺右括號："+s);
      return {o:"fn",f:lx,args:args};
    }
    throw new Error("未知符號 "+x);
  }
  var e=expr(); if(i<t.length)throw new Error("多餘內容："+s); return e;
}
var CACHE={};
function compile(s){if(!CACHE[s])CACHE[s]=parse(s);return CACHE[s];}
function isNum(x){return x!==""&&x!==null&&x!==true&&x!==false&&isFinite(Number(x));}
function blank(x){return x===""||x===null||x===undefined;}
function toMs(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;}
function ev(n,get){
  switch(n.o){
    case "lit":return n.v;
    case "var":var v=get(n.v);return Array.isArray(v)?v.join(","):(v==null?"":String(v));
    case "cb":var a=get(n.v);return Array.isArray(a)&&a.indexOf(n.c)>=0?"1":"0";
    case "and":return truthy(ev(n.a,get))&&truthy(ev(n.b,get));
    case "or":return truthy(ev(n.a,get))||truthy(ev(n.b,get));
    case "neg":var q=ev(n.a,get);return isNum(q)?-Number(q):"";
    case "+":case "-":case "*":case "/":
      var x=ev(n.a,get),y=ev(n.b,get);if(!isNum(x)||!isNum(y))return "";x=+x;y=+y;
      return n.o==="+"?x+y:n.o==="-"?x-y:n.o==="*"?x*y:(y===0?"":x/y);
    case "=":case "<>":
      var l=ev(n.a,get),r=ev(n.b,get),eq=(isNum(l)&&isNum(r))?(+l===+r):(String(l)===String(r));
      return n.o==="="?eq:!eq;

    case "fn":
      if(n.f==="if")return truthy(ev(n.args[0],get))?ev(n.args[1],get):ev(n.args[2],get);
      if(n.f==="round"){var z=ev(n.args[0],get),dp=n.args[1]?+ev(n.args[1],get):0;if(!isNum(z))return "";var k=Math.pow(10,dp);return Math.round(+z*k)/k;}

function truthy(x){return x===true||(x!==false&&x!==""&&x!=="0"&&x!==0&&x!=null);}

/* ---------- date parsing (民國／西元) ---------- */
function parseDate(raw){
  var s=String(raw||"").trim();if(!s)return {iso:""};
  s=s.replace(/^民國/,"").replace(/\s+/g,"").replace(/[年月]/g,"/").replace(/日$/,"").replace(/[.\-]/g,"/");
  var m,y,mo,d;
  if((m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/))){y=+m[1];mo=+m[2];d=+m[3];}
  else if((m=s.match(/^(\d{2,3})\/(\d{1,2})\/(\d{1,2})$/))){y=+m[1]+1911;mo=+m[2];d=+m[3];}
  else if((m=s.match(/^((?:19|20)\d{2})(\d{2})(\d{2})$/))){y=+m[1];mo=+m[2];d=+m[3];}
  else if((m=s.match(/^(\d{2,3})(\d{2})(\d{2})$/))){y=+m[1]+1911;mo=+m[2];d=+m[3];}
  else return {iso:"",err:1};
  var dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return {iso:"",err:1};
  return {iso:y+"-"+pad(mo)+"-"+pad(d)};
}
function rocOf(iso){var y=+iso.slice(0,4)-1911;return "民國 "+y+"/"+iso.slice(5,7)+"/"+iso.slice(8,10);}

/* ---------- validation ---------- */
function checkForm(id,fm,inst,forComplete,mode){
  mode=mode||"main";
  var E=[],W=[],g=getter(id,inst,mode),src=formSrc(id,fm.id,inst,mode);
  (BYFORM[fm.id]||[]).forEach(function(f){
    if(!isData(f)||!visible(id,f,inst,mode))return;
    var v=src[f.v],empty=v==null||v===""||(Array.isArray(v)&&!v.length);
    if(src["_bad_"+f.v]){E.push({f:f.v,m:"日期無法辨識，請重新輸入"});return;}
    if(!empty&&(f.val==="number"||f.val==="integer")){
      if(!isNum(v))E.push({f:f.v,m:"請輸入數字"});
      else if(f.val==="integer"&&+v!==Math.round(+v))E.push({f:f.v,m:"請輸入整數"});
      else if((f.min!=null&&+v<f.min)||(f.max!=null&&+v>f.max))E.push({f:f.v,m:"應介於 "+f.min+"–"+f.max});
    }
    if(forComplete&&f.req&&empty)E.push({f:f.v,m:"必填"});
    if(forComplete&&/_verified$/.test(f.v)&&!empty&&v!=="1")E.push({f:f.v,m:"逐欄核對後才能標記完成"});
  });
  if(mode==="main"){
    /* 來源文件：區段內有資料就必須註明來源 */
    var srcs=src._srcs||{};
    sectionsOf(fm.id).forEach(function(sec){
      var has=sec.fields.some(function(f){if(!isData(f)||/_verified$/.test(f.v)||!visible(id,f,inst,mode))return false;var v=src[f.v];return !(v==null||v===""||(Array.isArray(v)&&!v.length));});
      if(!has)return;
      var s=srcs[sec.key]||{};
      if(!s.t)(forComplete?E:W).push({f:"src:"+sec.key,m:"請註明這一段資料的來源文件",sec:1});
      else if(!s.d)W.push({f:"src:"+sec.key,m:"來源文件未填日期",sec:1});
    });
    /* 未結案問題 */
    var oq=DB.q.filter(function(q){return q.sid===id&&q.form===fm.id&&(q.status==="open"||q.status==="returned")&&(!fm.rep||q.inst===instKey(inst));});
    if(forComplete&&oq.length)oq.forEach(function(q){E.push({f:q.f,m:"有未結案的問題（"+Q_STATUS[q.status]+"）"});});
    RULES.forEach(function(rl){
      if(rl.f!==fm.id)return;if(rl.onComplete&&!forComplete)return;
      if(truthy(evalStr(rl.x,g)))(rl.s==="E"?E:W).push({f:rl.at,m:rl.n});
    });
  }
  return {E:E,W:W};
}
function recordState(id){
  var r=recOf(id),out={bad:false,allDone:true};
  FORMS.forEach(function(fm){
    if(fm.rep){var arr=r[fm.id];out[fm.id]=arr.length?(arr.every(function(x){return x._s===2;})?2:1):0;
      if(arr.some(function(x){return x._s!==2;}))out.allDone=false;
      arr.forEach(function(x){if(checkForm(id,fm,x,false).E.length)out.bad=true;});}
    else{out[fm.id]=r[fm.id]._s||0;
      if(formShown(id,fm)){if(out[fm.id]!==2)out.allDone=false;if(checkForm(id,fm,null,false).E.length)out.bad=true;}}
  });
  out.open=DB.q.filter(function(q){return q.sid===id&&q.status==="open";}).length;
  out.returned=DB.q.filter(function(q){return q.sid===id&&q.status==="returned";}).length;
  out.signed=!!r.sign;
  return out;
}

    {k:"type",label:"問題類型",type:"select",options:Q_TYPES,req:1},

    {k:"to",label:"指派醫師（可空白＝任何醫師）",type:"text",value:lsGet("escc-abstraction-lastdoc-name")}],ok:"送出"}).then(function(v){

function qAction(qid,act,fm,inst,f){
  if(!needWho())return;
  var q=DB.q.filter(function(x){return x.id===qid;})[0];if(!q)return;
  var cv=formSrc(q.sid,q.form,inst,"main")[q.f];
  var need=act==="return"||act==="unknown"||act==="resend";
  var labels={confirm:"確認原值（"+valText(f,cv)+"）",correct:"確認更正後的值（"+valText(f,cv)+"）",unknown:"判定病歷無法確認",return:"退回登錄人員補查",resend:"補查完成，再送醫師",withdraw:"撤回這個問題"};
  if(act==="correct"&&JSON.stringify(cv==null?"":cv)===JSON.stringify(q.cur)){toast("請先在上方欄位改成正確的值，再按「已在上方更正」");return;}
  dialog({title:labels[act],fields:[{k:"note",label:need?"說明（必填）":"說明（選填）",type:"textarea",req:need?1:0}],ok:"確定"}).then(function(v){
    if(!v)return;

    else if(act==="return")q.status="returned";

    logChange(q.form,"問題「"+f.l+"」"+(Q_ACT[act]||act)+(v.note?"："+v.note:""));
    persist(true);renderForm();refreshCur();renderMain();toast(Q_ACT[act]+"完成");
  });
}

var AUD_FIELDS=[];FORMS.filter(function(f){return f.audit;}).forEach(function(fm){(BYFORM[fm.id]||[]).forEach(function(f){if(editable(f)&&f.t!=="notes"&&!/_verified$/.test(f.v))AUD_FIELDS.push(f);});});
function drawSample(){
  refreshStates();
  var pool=DB.order.filter(function(id){return STATE[id]&&STATE[id].core_abstraction===2&&DB.audSample.indexOf(id)<0;});
  if(!pool.length){toast("目前沒有已完成核心補登、且尚未抽過的病人");return;}
  var n=Math.max(1,Math.round(pool.length*0.05));
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  pool.slice(0,n).forEach(function(id){DB.audSample.push(id);audOf(id);});
  persist(true);refreshStates();renderRail();
  ask("已從 "+(pool.length)+" 位已完成核心補登的病人中隨機抽出 "+n+" 位（5%）。請由另一位人員切換身分為「稽核員」重摘。",true);
}
function agree(f,a,b){
  var ea=a==null||a===""||(Array.isArray(a)&&!a.length),eb=b==null||b===""||(Array.isArray(b)&&!b.length);
  if(ea&&eb)return true;if(ea!==eb)return false;
  if(Array.isArray(a)||Array.isArray(b))return JSON.stringify((a||[]).slice().sort())===JSON.stringify((b||[]).slice().sort());
  if(f.val==="number"||f.val==="integer"){var tol=/_cm$/.test(f.v)?1:(/pct/.test(f.v)?2:0);return Math.abs(+a-+b)<=tol;}
  return String(a)===String(b);
}
function kappa(pairs){
  var n=pairs.length;if(n<2)return null;
  var po=pairs.filter(function(p){return p[0]===p[1];}).length/n,ca={},cb={};
  pairs.forEach(function(p){ca[p[0]]=(ca[p[0]]||0)+1;cb[p[1]]=(cb[p[1]]||0)+1;});
  var pe=0;Object.keys(ca).forEach(function(k){pe+=(ca[k]/n)*((cb[k]||0)/n);});
  return pe===1?null:(po-pe)/(1-pe);
}
function auditReport(){
  var ids=DB.audSample.filter(function(id){return DB.aud[id]&&DB.aud[id].done;});
  var rows=[],dis=[];
  AUD_FIELDS.forEach(function(f){
    var pairs=[],ag=0,n=0;
    ids.forEach(function(id){
      var fmId=f.f,orig=recOf(id)[fmId]||{},au=DB.aud[id].data[fmId]||{};
      var vo=visible(id,f,null,"main"),va=visible(id,f,null,"audit");if(!vo&&!va)return;
      var a=vo?orig[f.v]:"",b=va?au[f.v]:"";n++;
      if(agree(f,a,b))ag++;else dis.push({id:id,f:f,a:a,b:b});
      if(f.t==="radio"||f.t==="yesno"||f.t==="dropdown")pairs.push([String(a==null?"":a),String(b==null?"":b)]);
    });
    if(n)rows.push({f:f,n:n,pct:ag/n,k:kappa(pairs)});
  });
  return {ids:ids,rows:rows,dis:dis};
}
function showAuditReport(){

function parseCSV(t){
  t=t.replace(/^\ufeff/,"");var rows=[],row=[],cell="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}

  function idb(){if(!dbp)dbp=new Promise(function(res,rej){var r=indexedDB.open(IDBN,1);r.onupgradeneeded=function(){r.result.createObjectStore(ST);};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbp;}
  function get(k){return idb().then(function(db){return new Promise(function(res,rej){var g=db.transaction(ST).objectStore(ST).get(k);g.onsuccess=function(){res(g.result);};g.onerror=function(){rej(g.error);};});});}
  function put(k,v){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(ST,"readwrite");tx.objectStore(ST).put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
  function kek(secret,salt,iter){return crypto.subtle.importKey("raw",enc.encode(secret),"PBKDF2",false,["deriveKey"]).then(function(b){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter||ITER,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);});}
  function aesEnc(key,bytes){var iv=rnd(12);return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,bytes).then(function(ct){return {iv:b64(iv),ct:b64(ct)};});}
  function aesDec(key,o){return crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(o.iv)},key,ub64(o.ct)).then(function(pt){return new Uint8Array(pt);});}
  function wrap(raw,secret){var salt=rnd(16);return kek(secret,salt).then(function(k){return aesEnc(k,raw);}).then(function(w){return {salt:b64(salt),iter:ITER,wrap:w};});}
  function unwrap(entry,secret){return kek(secret,ub64(entry.salt),entry.iter).then(function(k){return aesDec(k,entry.wrap);});}
  function dkKey(raw){return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);}
  var B32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  function recoveryCode(){var u=rnd(20),bits="",s="";u.forEach(function(x){bits+=("00000000"+x.toString(2)).slice(-8);});
    for(var i=0;i+5<=bits.length;i+=5)s+=B32[parseInt(bits.slice(i,i+5),2)];return s.match(/.{1,4}/g).join("-");}
  function normRec(c){return String(c||"").toUpperCase().replace(/[^A-Z2-7]/g,"");}
  function emptyDB(){return {v:2,pre:{},rec:{},order:[],q:[],aud:{},audSample:[]};}
  function saveMeta(){return put("meta",META);}
  function saveVault(str,key){return aesEnc(key,enc.encode(str)).then(function(v){return put("vault",v);});}
  function readVault(){return get("vault").then(function(v){if(!v)return null;return aesDec(DK,v).then(function(u){return JSON.parse(dec.decode(u));});});}
  function user(name){return ((META&&META.users)||[]).filter(function(x){return x.name===name;})[0];}
  function secLog(act){
    if(!DK)return;DB.sec=DB.sec||{log:[]};
    var e={t:stamp(),by:SESSION?SESSION.name:"",role:SESSION?SESSION.role:"",act:act};DB.sec.log.push(e);
    secChain=secChain.then(function(){var L=DB.sec.log,i=L.indexOf(e),prev=i>0?(L[i-1].h||""):"";
      return crypto.subtle.digest("SHA-256",enc.encode(prev+JSON.stringify({t:e.t,by:e.by,role:e.role,act:e.act}))).then(function(h){e.h=b64(h);persist();});});
  }
  var PERM={load:["manager"],qout:["abstractor","manager"],qin:["physician","manager"],sample:["manager"],report:["manager"],
            redcap:["manager"],redcapx:["manager"],srcs:["manager"],backup:["manager","abstractor","physician","auditor"],restore:["manager"]};

  function setup(name,pw){
    if(META)return Promise.reject(new Error("此電腦已建立帳號"));
    DKraw=rnd(32);var rec=recoveryCode();
    return Promise.all([wrap(DKraw,pw),wrap(DKraw,normRec(rec)),dkKey(DKraw)]).then(function(r){
      META={v:1,created:stamp(),users:[Object.assign({name:name,role:"manager",created:stamp(),by:name},r[0])],rec:r[1],fails:[]};
      DK=r[2];var old=null;try{old=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
      DB=(old&&old.pre)?migrate(old):emptyDB();SESSION={name:name,role:"manager"};
      return saveMeta().then(function(){return flush();}).then(function(){
        if(old){try{localStorage.removeItem(KEY);}catch(e){}}
        secLog("建立資料管理帳號"+(old&&old.pre?"；已匯入並刪除舊版未加密資料":""));
        return {recovery:rec,migrated:!!(old&&old.pre)};});

      return saveMeta().then(function(){return new Promise(function(r){setTimeout(function(){r(false);},600);});});};
    if(!u)return fail();
    return unwrap(u,pw).then(function(raw){DKraw=raw;return dkKey(raw);},function(){return null;}).then(function(k){
      if(!k)return fail();DK=k;SESSION={name:u.name,role:u.role};

  function recover(code,name,newPw){

  function exportPackage(forName,pw){
    if(!isMgr())return Promise.reject(new Error("只有資料管理可以匯出分包"));

    var salt=rnd(16);return kek(pw,salt).then(function(k){return aesEnc(k,enc.encode(prefillCsv(ids)));}).then(function(o){

  function importPackage(text,pw){

    if(!p||p.kind!=="escc-prefill-package"||!p.salt||!p.ct)return Promise.reject(new Error("不是本工作台的加密分包"));
    return kek(pw,ub64(p.salt),p.iter||ITER).then(function(k){return aesDec(k,{iv:p.iv,ct:p.ct});})
      .then(function(u){return dec.decode(u);},function(){throw new Error("分包密碼錯誤");})
      .then(function(csv){var rows=parseCSV(csv),ix=rows[0].map(function(x){return x.trim();}).indexOf("record_id");
        var ids=rows.slice(1).map(function(r){return (r[ix]||"").trim();}).filter(Boolean);

        if(target){DB.assign=DB.assign||{};ids.forEach(function(id){DB.assign[id]=target;});}
        secLog("匯入加密分包 "+ids.length+" 位（"+(p.created||"")+"，"+(p.by||"")+" 製作）"+(target?"，分派給 "+target:""));

        '<p><button class="btn go" type="button" id="bEven">把尚未分派的病人平均分給勾選的人</button> <button class="btn warn" type="button" id="bUn">收回勾選者的病人</button></p>'
        :'<p class="desc">這台電腦還沒有登錄人員帳號，請先到「帳號管理」新增。</p>')+
      '<h3>加密分包（在電腦之間傳遞預填資料）</h3><p class="desc">分包檔以另設的分包密碼加密（至少 10 字元）。分包密碼請當面或電話告知接收的資料管理，不要和檔案放在一起。接收端在這一頁按「匯入加密分包」。</p>'+
      '<p><select id="pkgFor"><option value="*">全部病人（'+DB.order.length+' 位）</option>'+abs.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'（'+(cnt[n]||0)+' 位）</option>';}).join("")+'</select> '+
      '<button class="btn" type="button" id="bPkgOut">匯出加密分包</button> <button class="btn" type="button" id="bPkgIn">匯入加密分包</button></p></section>';
    var picked=function(){return $$("[data-an]",m).filter(function(c){return c.checked;}).map(function(c){return c.dataset.an;});};
    var be=$("#bEven");if(be)be.onclick=function(){try{var n=assignEven(picked());toast("已分派 "+n+" 位");refreshStates();renderRail();renderAssign();}catch(e){toast(e.message);}};
    var bu=$("#bUn");if(bu)bu.onclick=function(){var ns=picked();if(!ns.length){toast("請勾選登錄人員");return;}ask("收回 "+ns.join("、")+" 的病人？已填的內容不會刪除。").then(function(ok){if(!ok)return;var n=unassign(ns);toast("已收回 "+n+" 位");refreshStates();renderRail();renderAssign();});};
    $("#bPkgOut").onclick=function(){var f=$("#pkgFor").value;dialog({title:"匯出加密分包",msg:"對象："+(f==="*"?"全部病人":f),fields:[{k:"p",label:"分包密碼（至少 10 字元）",type:"password",req:1},{k:"p2",label:"再輸入一次",type:"password",req:1}],ok:"匯出"})
      .then(function(v){if(!v)return;if(v.p!==v.p2){toast("兩次分包密碼不同");return;}exportPackage(f,v.p).then(function(x){offer(x.name,x.data);}).catch(function(e){toast(e.message);});});};
    $("#bPkgIn").onclick=function(){pickFile($("#fJson"),function(t){dialog({title:"匯入加密分包",fields:[{k:"p",label:"分包密碼",type:"password",req:1}],ok:"匯入"})
      .then(function(v){if(!v)return;importPackage(t,v.p).then(function(r){toast("已匯入 "+r.n+" 位"+(r.assigned?"，分派給 "+r.assigned:(r.forName&&r.forName!=="*"?"（這台電腦沒有 "+r.forName+" 帳號，尚未分派）":"")));refreshStates();renderRail();renderAssign();}).catch(function(e){toast(e.message);});});});};
  }
  function idleCheck(){if(SESSION&&Date.now()-lastAct>IDLE_MS)lock("閒置 "+Math.round(IDLE_MS/60000)+" 分鐘自動鎖定");}
  function init(){
    ["mousemove","keydown","click","scroll","touchstart"].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});});
    setInterval(idleCheck,30000);
    document.addEventListener("visibilitychange",function(){if(document.hidden&&DK)flush();});
    window.addEventListener("beforeunload",function(){if(DK)flush();});
    $("#bLock").onclick=function(){lock("手動鎖定");};
    $("#bUsers").onclick=function(){if(SESSION&&SESSION.role==="manager")renderUsers();};
    $("#bAssign").onclick=function(){if(SESSION&&SESSION.role==="manager")renderAssign();};
    $("#bPw").onclick=function(){if(!SESSION)return;dialog({title:"變更密碼",fields:[{k:"o",label:"目前密碼",type:"password",req:1},{k:"n",label:"新密碼（至少 8 字元）",type:"password",req:1},{k:"n2",label:"再輸入一次新密碼",type:"password",req:1}],ok:"變更"})
      .then(function(v){if(!v)return;if(v.n!==v.n2){toast("兩次新密碼不同");return;}changeOwn(v.o,v.n).then(function(){toast("密碼已變更");}).catch(function(e){toast(e.message);});});};
    return get("meta").then(function(m){META=m||null;showAuth();});
  }
  return {session:function(){return SESSION;},init:init,can:can,backupString:backupString,restoreText:restoreText,saveVault:saveVault,secLog:secLog};
})();

/* ---------- init ---------- */
refreshStates();renderRail();renderMain();SEC.init();

})();

</script>
</body>
</html>
