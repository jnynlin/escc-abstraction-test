<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ePRO 模組沙盤 v6.5（PI 版）</title>
<style>
:root{--ink:#1d2430;--soft:#5b6472;--rule:#d9dee6;--paper:#ffffff;--well:#f4f6f9;--accent:#0f5e6b;--accent-soft:#e1f0f2;--ok:#1b6b3a;--warn:#8a5a00;--warn-soft:#fbf1dc;--bad:#9b2c2c;--bad-soft:#fbe6e6;--focus:#0b57d0;
 --k-owner:#e1f0f2;--k-role:#eceff3;--k-disease:#ece6f7;--k-tpl:#fbf1dc;--k-scale:#e3edfb;
 --c0:#0f5e6b;--c1:#b26b00;--c2:#5b3fa0;--c3:#1b6b3a;--c4:#9b2c2c;--c5:#0b57d0}

 --k-owner:#17353a;--k-role:#252c36;--k-disease:#2c2640;--k-tpl:#3a2f12;--k-scale:#1b2a40;
 --c0:#7fd0dc;--c1:#f0c36a;--c2:#b9a6f0;--c3:#7fd49b;--c4:#f1a1a1;--c5:#8ab4f8}}
html{-webkit-text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
h1{font-size:1.35rem;line-height:1.3;margin:0}h2{font-size:1.15rem;margin:1.4em 0 .5em;border-bottom:2px solid var(--rule);padding-bottom:.2em}h3{font-size:1.02rem;margin:1em 0 .3em}
p,li{overflow-wrap:anywhere}.soft{color:var(--soft)}.small{font-size:.88rem}
header.top{padding:12px 16px 8px;border-bottom:1px solid var(--rule)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--well);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;min-height:44px}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button.warnb{border-color:var(--bad);color:var(--bad)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:5}
nav.tabs button{background:transparent;border-color:transparent;font-weight:600}nav.tabs button[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge{display:inline-block;min-width:1.6em;text-align:center;border-radius:999px;font-size:.8rem;padding:0 6px;margin-left:4px;background:var(--well);border:1px solid var(--rule)}
.badge.red{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}.badge.amber{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:12px 16px 60px;max-width:1500px;margin:0 auto}
aside#palwrap{align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;border-right:1px solid var(--rule);padding-right:14px}
#pal summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.grp{margin:.7em 0}.grp>.t{font-weight:700;font-size:.92rem;color:var(--soft);margin-bottom:4px}

.chip.k-owner{background:var(--k-owner)}.chip.k-disease{background:var(--k-disease)}.chip.k-template{background:var(--k-tpl)}.chip.k-scale{background:var(--k-scale)}
.chip .x{border:0;background:transparent;min-height:28px;padding:0 4px;color:var(--soft);cursor:pointer}
.chip small{color:var(--soft)}
.namein{width:100%;margin:2px 0}
.study{border-top:3px solid var(--rule);padding:10px 0 14px;margin:0 0 22px}

.study>header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5em 0}

.tplblock{border-left:4px solid var(--warn);padding:6px 0 6px 12px;margin:.8em 0}
.tplhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meter{font-size:.92rem;border-radius:6px;padding:1px 8px;background:var(--well);border:1px solid var(--rule)}.meter.over{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.issues{list-style:none;margin:.5em 0 0;padding:0;font-size:.92rem}
.issues li{padding:3px 0 3px 12px;border-left:4px solid var(--rule)}.issues li.red{border-color:var(--bad);color:var(--bad)}.issues li.amber{border-color:var(--warn)}
details.iss summary{cursor:pointer;color:var(--soft);font-size:.92rem;min-height:36px;display:flex;align-items:center}
.lvl{font-weight:700;margin:1em 0 .2em}.lvl.red{color:var(--bad)}.lvl.amber{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--soft);font-weight:600}
.scroll{overflow-x:auto}.scroll svg{min-width:760px}
td.over,tr.over td{background:var(--bad-soft)}td.al{background:var(--accent-soft)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px;min-height:44px;border-radius:8px;cursor:pointer}.opt:hover{background:var(--well)}.opt input{width:22px;height:22px;margin-top:3px;flex:none}

.sim-ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:.5em 0}.sim-ctl label{display:flex;flex-direction:column;font-size:.88rem;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--soft);margin:.4em 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:10px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}
svg text{fill:var(--ink);font:12px sans-serif}svg .ax{stroke:var(--rule);stroke-width:1}svg .lane{stroke:var(--rule);stroke-width:1;opacity:.6}
svg .c0{fill:var(--c0)}svg .c1{fill:var(--c1)}svg .c2{fill:var(--c2)}svg .c3{fill:var(--c3)}svg .c4{fill:var(--c4)}svg .c5{fill:var(--c5)}
svg .vis{fill:var(--ink)}svg .draw{fill:var(--bad)}svg .over{stroke:var(--bad);stroke-width:2;fill:none}svg .alg{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 2}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}aside#palwrap{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);padding:0 0 8px}.row .lab{flex-basis:100%}}
@media print{nav.tabs,.tools,aside#palwrap button,.x{display:none}.layout{display:block}}

main{min-width:0}.zone .chip,.tplhead .chip{white-space:nowrap}.scroll{max-width:100%}
select{max-width:100%}.tplhead select{min-width:0}

/* ---------- 研究架構畫面（2026-10-07）---------- */
.bcanvas{position:relative;display:flex;gap:18px;align-items:flex-start;overflow-x:auto;padding:6px 2px 24px}
.bcanvas svg#links{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.bstudy{flex:0 0 330px;border-top:8px solid var(--rule);padding:8px 0 10px;position:relative}
.bstudy.t-clinic{border-top-color:var(--c0)}.bstudy.t-prosp{border-top-color:var(--c1)}.bstudy.t-retro{border-top-color:var(--soft)}
.bstudy.over{outline:3px dashed var(--accent);outline-offset:4px}
.bstudy .btitle{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bstudy .btitle input.sname{flex:1 1 100%;font-weight:700;min-width:0}
.bstudy select{max-width:100%;min-height:36px;padding:2px 6px;font-size:.88rem}
.bsec{margin:.55em 0}.bsec>.bl{font-size:.8rem;font-weight:700;color:var(--soft);margin-bottom:2px}
.slot{min-height:40px;border:2px dashed var(--rule);border-radius:10px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot .hint{color:var(--soft);font-size:.82rem}
.blk{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 10px;min-height:34px;cursor:grab;user-select:none;font-size:.9rem;position:relative}
.pblk{background:var(--k-owner);border:1px solid var(--accent);border-radius:999px}.pblk::before{content:"人";display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--paper);font-size:.72rem}
.rblk{background:var(--k-role);border:1px solid var(--rule)}
.dblk{background:var(--k-disease);border:0;border-radius:0;padding:5px 18px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.btpl{border:2px solid var(--warn);border-radius:12px;margin:.7em 0;background:var(--paper);position:relative}
.btpl.red{border-color:var(--bad)}
.btpl>.th{background:var(--k-tpl);border-radius:10px 10px 0 0;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btpl>.th .tn{font-weight:700;font-size:.92rem}
.btpl>.tb{padding:6px 8px 8px}
.sblk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--k-scale);border:1px solid var(--rule);border-left:8px solid var(--c5);border-radius:6px;padding:3px 8px;margin:7px 0 0;width:100%;cursor:grab;font-size:.88rem;position:relative}
.sblk::before{content:"";position:absolute;left:18px;top:-7px;width:20px;height:7px;background:var(--k-scale);border:1px solid var(--rule);border-bottom:0;border-radius:6px 6px 0 0}
.sblk.r-anchor{border-left-color:var(--c2)}.sblk.r-exploratory{border-left-color:var(--soft)}
.sblk .m{margin-left:auto;color:var(--soft);font-size:.8rem;white-space:nowrap}
.sblk .x,.blk .x{border:0;background:transparent;min-height:26px;padding:0 4px;color:var(--soft);cursor:pointer}
.sblk .warn{color:var(--warn);font-weight:700}.sblk.dup{outline:2px dashed var(--c1);outline-offset:1px}
.burden{display:flex;height:14px;border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin:6px 0 2px;background:var(--well);position:relative}
.burden i{display:block;height:100%}.burden i:nth-child(1){background:var(--c5)}.burden i:nth-child(2){background:var(--c2)}.burden i:nth-child(3){background:var(--c3)}.burden i:nth-child(4){background:var(--c1)}.burden i:nth-child(5){background:var(--c4)}
.burden.over{border-color:var(--bad)}.burden .bud{position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--ink)}
.tstrip{width:100%;height:42px;display:block}.tstrip line{stroke:var(--rule);stroke-width:1}.tstrip rect{fill:var(--accent)}.tstrip text{font-size:11px;fill:var(--soft)}
.bm .chip{border-radius:6px;min-height:32px}.bm .chip.k-owner{border-radius:999px}
.bm .chip.k-disease{border:0;border-radius:0;padding:4px 16px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
.bm .chip.k-scale{border-left:8px solid var(--c5)}.bm .chip.k-template{border:2px solid var(--warn);border-radius:10px}
body[data-drag=owner] .slot:not([data-accepts~=owner]),body[data-drag=role] .slot:not([data-accepts~=role]),body[data-drag=disease] .slot:not([data-accepts~=disease]),body[data-drag=template] .slot:not([data-accepts~=template]),body[data-drag=scale] .slot:not([data-accepts~=scale]){opacity:.3}
body[data-drag=owner] .slot[data-accepts~=owner],body[data-drag=role] .slot[data-accepts~=role],body[data-drag=disease] .slot[data-accepts~=disease],body[data-drag=template] .slot[data-accepts~=template],body[data-drag=scale] .slot[data-accepts~=scale]{border-color:var(--accent);background:var(--accent-soft)}
@keyframes snap{0%{transform:scale(.92);box-shadow:0 0 0 3px var(--accent)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}
.flash{animation:snap .7s ease-out}@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--accent)}}
@media (max-width:900px){.bcanvas{flex-direction:column;align-items:stretch;overflow-x:visible}.bstudy{flex:0 0 auto;width:100%}}

.pblk.sub{background:var(--k-role);border-color:var(--soft);border-style:dashed}.pblk.sub::before{background:var(--soft)}
.sblk .stw{font-size:.76rem;color:var(--soft);white-space:nowrap}
.role-pi{display:inline-block;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--paper);font-weight:700;font-size:.85rem}.role-sub{display:inline-block;padding:0 8px;border-radius:999px;border:1px dashed var(--soft);font-size:.85rem}

/* ---------- v4：身份、一次一個計畫（2026-10-08）---------- */
.who{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:.2em 0 .6em;padding:6px 10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px}

.who select{min-width:15em}
.projbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.4em 0 .6em}
.projbar .pj{display:inline-flex;align-items:center;gap:8px;text-align:left}
.projbar .pj[aria-pressed=true]{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent);font-weight:700}
.projbar .pr{font-size:.76rem;border-radius:999px;padding:0 8px;border:1px solid var(--rule);background:var(--paper);color:var(--soft)}
.projbar .pj[aria-pressed=true] .pr{border-color:var(--accent);color:var(--accent)}
.projbar .ovl{margin-left:auto}
.rolebar{margin:.3em 0 .8em;padding:6px 10px;border-left:6px solid var(--accent);background:var(--well);border-radius:0 8px 8px 0;font-size:.94rem}

.emptyproj{border:2px dashed var(--rule);border-radius:12px;padding:10px 16px;margin:.8em 0}
.bcanvas.single .bstudy{flex:1 1 auto;max-width:760px}
.sblk .dupn{flex:1 0 100%;font-size:.76rem;color:var(--c1);font-weight:600}
.ro{opacity:.92}.ro .chip,.ro .blk,.ro .sblk,.ro .th{cursor:default}
@media (max-width:900px){.bcanvas.single .bstudy{max-width:none}.who select{min-width:0;width:100%}}

/* ---------- v5：研究架構為主畫面、扁平化（2026-10-08）----------
   依「網頁扁平」偏好：沒有陰影、沒有卡片框／色帶／橫幅底色；區塊靠標題＋細線＋留白分開；各項目本身的形狀與虛線放置區保留（那是功能）；時間資料有圖 */
.who{background:none;border:0;border-radius:0;padding:0;margin:.3em 0 .9em}.who label{color:var(--ink)}
.rolebar,.rolebar[data-role="sub-PI"]{background:none;border:0;border-radius:0;padding:0;margin:.8em 0 0}
.rtag,.stag{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:0 8px;border:1px solid var(--accent);color:var(--accent);vertical-align:1px}
.rolebar[data-role="sub-PI"] .rtag{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.stag{border-color:var(--rule);color:var(--soft);font-weight:400}
.emptyproj{border:0;border-radius:0;padding:0;margin:1.6em 0}
.bstudy,.bstudy.t-clinic,.bstudy.t-prosp,.bstudy.t-retro{border-top:0;padding:0 0 10px}
.bcanvas.single{display:block}.bcanvas.single .bstudy{max-width:none}
.bhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:1.4em}
.bhead .sname{flex:1 1 320px;font-size:1.3rem;font-weight:700;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;padding:4px 0;min-height:44px}
.bmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bnote{margin:.4em 0 0}
.bh{font-size:.98rem;margin:2.6em 0 .7em;padding-bottom:.35em;border-bottom:1px solid var(--rule);color:var(--soft);letter-spacing:.05em}
.bgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 56px}
.bgrid .bh:first-child{margin-top:2em}
.btpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:44px 48px;align-items:start}
.bcanvas:not(.single) .bgrid,.bcanvas:not(.single) .btpls{grid-template-columns:minmax(0,1fr)}
.btpl{margin:0;border:1.5px solid var(--warn);border-radius:14px;background:transparent}
.btpl.red{border-color:var(--bad)}
.btpl>.th{background:none;border-radius:0;padding:10px 14px 2px}
.btpl>.th .tn{font-size:1rem}
.tctl{display:flex;flex-wrap:wrap;gap:6px 14px;padding:2px 14px 4px;align-items:flex-end}
.tc{display:flex;flex-direction:column;font-size:.74rem;color:var(--soft)}.tc select{min-height:34px}
.tc2{min-height:34px;padding:0 4px}
.btpl>.tb{padding:6px 14px 14px}
.burden{height:16px;margin:8px 0 3px}.burdtxt{margin-bottom:2px}
.sblk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;align-items:center;border:0;border-left:10px solid var(--sc,var(--c5));background:var(--k-scale);border-radius:6px;padding:6px 10px;margin:9px 0 0;width:auto}
.sblk::before{left:22px}
.sblk .sb1{grid-column:1;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.sblk .sb2{grid-column:1;display:flex;flex-wrap:wrap;gap:0 12px;font-size:.78rem;color:var(--soft)}
.sblk .sb3{grid-column:2;grid-row:1 / span 2;display:flex;gap:4px;align-items:center}
.sblk .m{margin-left:0}.sblk .sb3 select{min-height:30px;padding:0 4px;font-size:.84rem}
.sblk .dupn{flex:0 0 auto}
.tstrip{width:100%;max-width:640px;height:auto;display:block;margin-top:12px}
.tstrip text{font-size:10px;fill:var(--soft)}.tstrip .axis{stroke:var(--soft);stroke-width:1.2}.tstrip .grid{stroke:var(--rule);stroke-width:1}.tstrip text.tl{fill:var(--ink);font-weight:700}
.legend2{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.84rem;color:var(--soft);margin:.5em 0 .9em}
.legend2 i.lg{display:inline-block;width:20px;height:13px;margin-right:6px;vertical-align:-2px}
.legend2 i.p{border-radius:999px;background:var(--k-owner);border:1px solid var(--accent)}.legend2 i.r{border-radius:4px;background:var(--k-role);border:1px solid var(--rule)}
.legend2 i.d{background:var(--k-disease);clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 50%,calc(100% - 4px) 100%,4px 100%,0 50%)}
.legend2 i.t{border:2px solid var(--warn);border-radius:5px}.legend2 i.s{background:var(--k-scale);border-left:7px solid var(--c5);border-radius:3px}
.rec{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:700;line-height:1.5;border-radius:999px;padding:0 7px;background:var(--accent);color:var(--paper);vertical-align:1px;white-space:nowrap}
.chip.rc{font-weight:700}.bm .chip.k-disease.rc,.bm .chip.k-scale.rc,.bm .chip.k-template.rc{background:var(--accent-soft)}.bm .chip.k-template.rc{border-color:var(--accent)}
.rcnote{margin:.4em 0 .8em;padding:0;color:var(--accent)}
.cfm{margin:3.2em 0 0}.cfm h3{font-size:1.15rem;margin:0 0 .2em;padding-bottom:.35em;border-bottom:1px solid var(--rule)}

function setScaleRole(m,sid,tid,scaleId,role,actor){if(!canEdit(m,actor,sid))return {ok:false,msg:DENY_EDIT};var s=study(m,sid),t=s&&tplOf(s,tid),x=t&&t.scales.filter(function(q){return q.id===scaleId;})[0];if(!x)return {ok:false,msg:"找不到量表"};
  if(["primary","anchor","exploratory"].indexOf(role)<0)return {ok:false,msg:"找不到這個角色"};x.role=role;return {ok:true,msg:"已更新"};}

/* ---------- 放入／搬移（拖放與下拉共用）----------
   drag：{kind:"owner"|"role"|"disease"|"template"|"scale", id, from?:{studyId, tid?}}（from 有值＝搬移，會先從來源移除）
   target：{studyId, slot:"owner"|"members"|"diseases"|"templates"|"scales", tid?}  回傳 {ok,msg,tid?} */
function place(m,drag,target,actor){
  var s=study(m,target.studyId);if(!s)return {ok:false,msg:"找不到計畫"};
  if(actor!=null){var mgSlot=target.slot==="owner"||target.slot==="subpis";if(mgSlot?!canManage(m,actor,target.studyId):!canEdit(m,actor,target.studyId))return {ok:false,msg:mgSlot?DENY_MANAGE:DENY_EDIT};
    if(drag.from&&drag.from.studyId){var fromMg=drag.kind==="owner";if(fromMg?!canManage(m,actor,drag.from.studyId):!canEdit(m,actor,drag.from.studyId))return {ok:false,msg:"你沒有編輯原本那個計畫的權限"};}}
  var f=drag.from&&study(m,drag.from.studyId);
  var moving=!!drag.from;
  function removeFrom(){if(!moving||!f)return;
    if(drag.kind==="role"){var i=f.members.indexOf(drag.id);if(i>=0)f.members.splice(i,1);}
    else if(drag.kind==="disease"){var j=f.diseases.indexOf(drag.id);if(j>=0)f.diseases.splice(j,1);}
    else if(drag.kind==="owner"){if(drag.from.slot==="subpis"){var si=f.subpis.indexOf(drag.id);if(si>=0)f.subpis.splice(si,1);}else if(f.owner===drag.id)f.owner=null;}
    else if(drag.kind==="template"){var k=f.templates.map(function(t){return t.tid;}).indexOf(drag.tid);if(k>=0)f.templates.splice(k,1);}
    else if(drag.kind==="scale"){var ft=tplOf(f,drag.from.tid);if(ft){var q=ft.scales.map(function(x){return x.id;}).indexOf(drag.id);if(q>=0)ft.scales.splice(q,1);}}}
  if(drag.kind==="owner"){
    var o=by(OWNERS,drag.id);if(!o)return {ok:false,msg:"找不到這個人"};
    if(o.kind==="sys2")return {ok:false,msg:"備援系統管理者只管平台，不擔任計畫的 PI 或 sub-PI"};
    if(target.slot==="subpis"){
      if(s.owner===drag.id)return {ok:false,msg:"這個人已是這個計畫的 PI，不能同時是 sub-PI"};
      if(s.subpis.indexOf(drag.id)>=0)return {ok:false,msg:"這個人已是這個計畫的 sub-PI"};
      s.subpis.push(drag.id);removeFrom();return {ok:true,msg:"已加入 sub-PI"};}
    if(target.slot!=="owner")return {ok:false,msg:"人員只能放在「PI」或「sub-PI」位置"};
    var wasSub=s.subpis.indexOf(drag.id);if(wasSub>=0)s.subpis.splice(wasSub,1);
    s.owner=drag.id;removeFrom();if(moving&&f===s)s.owner=drag.id;return {ok:true,msg:"已指定計畫 PI"};}
  if(drag.kind==="role"){
    if(target.slot!=="members")return {ok:false,msg:"成員角色要放在「成員」位置"};
    if(!by(ROLES,drag.id))return {ok:false,msg:"找不到這個角色"};
    if(s.members.indexOf(drag.id)>=0)return {ok:false,msg:"這個角色已在成員裡"};
    s.members.push(drag.id);removeFrom();return {ok:true,msg:"已加入成員"};}
  if(drag.kind==="disease"){
    if(target.slot!=="diseases")return {ok:false,msg:"疾病要放在「疾病」位置"};
    if(!by(DISEASES,drag.id))return {ok:false,msg:"找不到這個疾病"};
    if(s.diseases.indexOf(drag.id)>=0)return {ok:false,msg:"這個疾病已在計畫裡"};
    s.diseases.push(drag.id);removeFrom();return {ok:true,msg:"已加入疾病"};}
  if(drag.kind==="template"){
    if(target.slot!=="templates")return {ok:false,msg:"模板要放在「模板」位置"};
    var tp=by(TEMPLATES,moving?(f&&tplOf(f,drag.tid)||{}).tpl:drag.id);if(!tp)return {ok:false,msg:"找不到這個模板"};
    if(moving){var src=tplOf(f,drag.tid);if(!src)return {ok:false,msg:"來源模板不見了"};if(f===s)return {ok:false,msg:"同一個計畫內不用搬移"};
      removeFrom();src.tid=uid(m,"t");s.templates.push(src);return {ok:true,msg:"已搬移模板",tid:src.tid};}
    var ex=s.templates.filter(function(t){return t.tpl===tp.id;});if(ex.length)return {ok:false,msg:"這個計畫已有「"+tp.name+"」"};
    var nt={tid:uid(m,"t"),tpl:tp.id,cadence:tp.cadence,offset:tp.offset,venue:tp.venue,align:tp.id==="pprom"&&!HIDE_IRAE,scales:[]};s.templates.push(nt);return {ok:true,msg:"已加入模板",tid:nt.tid};}
  if(drag.kind==="scale"){
    if(target.slot!=="scales")return {ok:false,msg:"量表要放在某個模板裡"};
    var sc=by(SCALES,drag.id);if(!sc)return {ok:false,msg:"找不到這個量表"};
    var t=target.tid?tplOf(s,target.tid):null;
    if(!t){var pt=s.templates.filter(function(x){var d=by(TEMPLATES,x.tpl);return d&&d.patient;});
      if(pt.length===1)t=pt[0];else return {ok:false,msg:pt.length?"這個計畫有好幾個要病人填的模板，請把量表放到要用的那一個":"這個計畫還沒有要病人填的模板，請先加入模板"};}
    var td=by(TEMPLATES,t.tpl);if(!td||!td.patient)return {ok:false,msg:"這個模板不需要病人填問卷，不能放量表"};
    for(var i2=0;i2<t.scales.length;i2++)if(t.scales[i2].id===drag.id)return {ok:false,msg:"這個量表已在該模板裡"};
    t.scales.push({id:drag.id,role:"primary"});removeFrom();return {ok:true,msg:"已加入量表",tid:t.tid};}
  return {ok:false,msg:"不支援的操作"};}
function removeItem(m,studyId,kind,id,tid,actor){var s=study(m,studyId);if(!s)return false;if(actor!=null&&((kind==="owner"||kind==="subpi")?!canManage(m,actor,studyId):!canEdit(m,actor,studyId)))return false;
  if(kind==="owner"){s.owner=null;return true;}
  if(kind==="subpi"){var sp=s.subpis.indexOf(id);if(sp<0)return false;s.subpis.splice(sp,1);return true;}
  if(kind==="role"){var i=s.members.indexOf(id);if(i<0)return false;s.members.splice(i,1);return true;}
  if(kind==="disease"){var j=s.diseases.indexOf(id);if(j<0)return false;s.diseases.splice(j,1);return true;}
  if(kind==="template"){var k=s.templates.map(function(t){return t.tid;}).indexOf(tid);if(k<0)return false;s.templates.splice(k,1);return true;}
  if(kind==="scale"){var t=tplOf(s,tid);if(!t)return false;var q=t.scales.map(function(x){return x.id;}).indexOf(id);if(q<0)return false;t.scales.splice(q,1);return true;}
  return false;}

/* 模組維護者（量表監護人）：掛在量表模組上，不是掛在計畫上；任何人都可擔任（PI、sub-PI、非 PI） */
function setSteward(m,scaleId,personId,actor){if(!by(SCALES,scaleId))return false;m.stewards=m.stewards||{};
  if(actor!=null&&!isPlatform(actor)){var cur=m.stewards[scaleId];if(cur){if(cur!==actor)return false;}else if(personId!==actor)return false;}   /* 已有維護者→只有他或系統管理者能改；沒有→只能認領給自己 */
  if(personId==null||personId===""){delete m.stewards[scaleId];return true;}
  var o=by(OWNERS,personId);if(!o||o.kind==="sys2")return false;m.stewards[scaleId]=personId;return true;}
/* 人×計畫：某個人在每個計畫是 PI、sub-PI 或沒有；以及他維護哪些量表 */
function peopleMatrix(m){var people=OWNERS.filter(function(o){return o.kind!=="sys2";}).map(function(o){return {id:o.id,name:ownerName(m,o.id),kind:o.kind};}),cells={},st={};
  people.forEach(function(p){cells[p.id]={};st[p.id]=[];m.studies.forEach(function(s){cells[p.id][s.id]=s.owner===p.id?"PI":(s.subpis||[]).indexOf(p.id)>=0?"sub-PI":"";});});
  Object.keys(m.stewards||{}).forEach(function(sc){var pid=m.stewards[sc];if(st[pid]&&by(SCALES,sc))st[pid].push(sc);});
  return {people:people,studies:m.studies.map(function(s){return {id:s.id,name:s.name};}),cells:cells,stewards:st};}

/* ---------- 計算：每次施測的題數／分鐘 ---------- */
function tplLoad(t,speed){var items=0,min=0;t.scales.forEach(function(x){var sc=by(SCALES,x.id);if(sc){items+=sc.items;min+=sc.min;}});return {items:items,min:Math.round(min*(speed||1)*10)/10};}

/* ---------- 推薦組合（v6.3）：每個模板列出「預算內」的量表搭配，讓 PI 直接挑，不必自己拼 ----------
   規則：同一類量表（生活品質、ADL、心理）最多選一份；疾病專用量表只提供「這個計畫有的疾病」對應的那一份；依計畫的疾病與有沒有 C30 排序；
   另列「常見搭配但超過預算」（疾病專用量表＋C30），讓 PI 知道要不要調整預算。 */
function recommendCombos(m,sid,tid){var s=study(m,sid),t=s&&tplOf(s,tid),d=t&&by(TEMPLATES,t.tpl);if(!t||!d||!d.patient)return {within:[],common:[],n:0};
  var speed=m.speed||1;
  function load(ids){var items=0,min=0;ids.forEach(function(id){var sc=by(SCALES,id);items+=sc.items;min+=sc.min;});return {items:items,min:Math.round(min*speed*10)/10};}
  function fits(L){return (!d.budgetItems||L.items<=d.budgetItems)&&(!d.budgetMin||L.min<=d.budgetMin);}
  function ofKind(k){return SCALES.filter(function(x){return x.kind===k;}).map(function(x){return x.id;});}
  function shortName(id){return by(SCALES,id).name.replace(/^EORTC /,"");}
  function entry(ids,extra){var L=load(ids),o={ids:ids,items:L.items,min:L.min,label:ids.map(shortName).join("＋")+"（"+L.items+" 題・"+L.min+" 分）"};for(var k in extra)o[k]=extra[k];return o;}
  var mods=[];(s.diseases||[]).forEach(function(did){var dz=by(DISEASES,did);if(dz&&dz.mod&&mods.indexOf(dz.mod)<0)mods.push(dz.mod);});
  var groups=t.tpl==="triage"?[ofKind("triage")]:[ofKind("qol"),ofKind("adl"),ofKind("psych")];
  var combos=[[]];
  groups.forEach(function(g){var next=[];combos.forEach(function(c){next.push(c);g.forEach(function(id){next.push(c.concat([id]));});});combos=next;});
  if(t.tpl!=="triage"){var withMods=[];combos.forEach(function(c){for(var mk=0;mk<(1<<mods.length);mk++){var pick=[];mods.forEach(function(x,i){if(mk>>i&1)pick.push(x);});withMods.push(pick.concat(c));}});combos=withMods;}
  var within=combos.filter(function(c){return c.length&&fits(load(c));}).map(function(c){var covered=c.filter(function(id){return mods.indexOf(id)>=0;}).length;return entry(c,{score:[covered,c.indexOf("c30")>=0?1:0,-Math.abs(c.length-2.5),-load(c).min]});});
  within.sort(function(a,b){for(var i=0;i<a.score.length;i++){if(a.score[i]!==b.score[i])return b.score[i]-a.score[i];}return 0;});
  var common=[];if(t.tpl!=="triage")mods.forEach(function(mid){var ids=["c30",mid],e=entry(ids,{over:!fits(load(ids))});if(e.over)common.push(e);});
  var out=[];if(mods.length>1){mods.forEach(function(mid){within.filter(function(e){return e.ids.indexOf(mid)>=0;}).slice(0,4).forEach(function(e){if(out.indexOf(e)<0)out.push(e);});});within.forEach(function(e){if(out.length<8&&out.indexOf(e)<0)out.push(e);});}else out=within.slice(0,8);   /* 計畫有好幾個疾病時，每個疾病各列幾組，不要被其中一個占滿 */
  within.forEach(function(e){delete e.score;});
  return {within:out,common:common,n:within.length};}
/* 套用推薦組合：取代這個模板目前的量表（全部設為主要量表）；檢查權限 */
function applyCombo(m,sid,tid,ids,actor){if(!canEdit(m,actor,sid))return {ok:false,msg:DENY_EDIT};var s=study(m,sid),t=s&&tplOf(s,tid),d=t&&by(TEMPLATES,t.tpl);if(!t)return {ok:false,msg:"找不到模板"};
  if(!d.patient)return {ok:false,msg:"這個模板不需要病人填問卷，不能放量表"};
  if(!Array.isArray(ids)||!ids.length||ids.some(function(id,i){return !by(SCALES,id)||ids.indexOf(id)!==i;}))return {ok:false,msg:"找不到這個量表"};
  t.scales=ids.map(function(id){return {id:id,role:"primary"};});return {ok:true,msg:"已套用推薦組合",tid:tid};}

/* ---------- 規則檢查 ---------- */
function ownerName(m,id){var o=by(OWNERS,id);return o?((m.names&&m.names[id])||o.name):"（未指定）";}
function lint(m){var out=[];
  function add(level,studyId,code,msg){out.push({level:level,study:studyId,code:code,msg:msg});}
  var hasSys=m.studies.some(function(s){return s.owner==="sys";});
  var scaleUse={};
  m.studies.forEach(function(s){
    var ty=by(STYPES,s.type)||STYPES[0],nm="「"+s.name+"」";
    if(!s.owner)add("red",s.id,"no-owner",nm+"還沒有指定計畫 PI");
    if(!s.templates.length)add("amber",s.id,"no-template",nm+"還沒有模板");
    var pt=s.templates.filter(function(t){var d=by(TEMPLATES,t.tpl);return d&&d.patient;});
    if(s.type==="retro"&&pt.length)add("red",s.id,"type-mismatch",nm+"是回溯性病歷研究，不接觸病人，卻放了要病人填的模板");
    if(s.type==="retro"&&s.templates.some(function(t){return t.tpl==="irae";}))add("amber",s.id,"type-mismatch2",nm+"是回溯性研究，不適用 irAE 前瞻採檢時程");
    if(ty.id==="prosp")add("info",s.id,"icf",nm+"：前瞻性收案需要同意書與 IRB");
    if(ty.id==="clinic")add("info",s.id,"clinic",nm+"：屬於臨床照護；之後若要做研究，需另外申請 IRB");
    if(ty.id==="retro")add("info",s.id,"retro",nm+"：是否需要病人同意，要看 IRB 審查結果");
    if(pt.length){add("info",s.id,"identity",nm+"：病人填答前要先核對身分（姓氏、生日末四碼等），核對後才能往下");
      if(!s.members.some(function(r){return r==="nurse"||r==="doctor";}))add("amber",s.id,"no-reviewer",nm+"病人會填答，但還沒有醫護人員負責看答案");}
    s.templates.forEach(function(t){var d=by(TEMPLATES,t.tpl);if(!d||!d.patient)return;var L=tplLoad(t,m.speed),tn="「"+d.name+"」";
      if(!t.scales.length)add("amber",s.id,"no-scale",nm+tn+"還沒有量表");
      var oi=d.budgetItems&&L.items>d.budgetItems,om=d.budgetMin&&L.min>d.budgetMin;
      if(oi&&om)add("red",s.id,"over-both",nm+tn+"每次 "+L.items+" 題、約 "+L.min+" 分鐘，超過預算（最多 "+d.budgetItems+" 題、"+d.budgetMin+" 分鐘）");
      else if(oi)add("red",s.id,"over-items",nm+tn+"每次 "+L.items+" 題，超過預算 "+d.budgetItems+" 題");
      else if(om)add("red",s.id,"over-min",nm+tn+"每次約 "+L.min+" 分鐘，超過預算 "+d.budgetMin+" 分鐘");
      var trg=t.scales.filter(function(x){var sc=by(SCALES,x.id);return sc&&sc.kind==="triage"&&sc.id!=="proctcae";});
      if(trg.length>1)add("info",s.id,"core-and-full",nm+tn+"同時放了症狀核心版和完整版：通常二選一，或平常用核心版、每第 3 次回診才用完整版");
      var roles=t.scales.map(function(x){return x.role;});
      if(roles.indexOf("anchor")>=0&&roles.filter(function(r){return r==="primary";}).length===0)add("amber",s.id,"anchor-alone",nm+tn+"有「對照」量表，卻沒有主要量表可以比");
      if(roles.indexOf("anchor")>=0&&roles.indexOf("primary")>=0)add("info",s.id,"pk",nm+tn+"有主要量表和對照量表：可以並排比較，各自計分、不改題");
      t.scales.forEach(function(x){var sc=by(SCALES,x.id);if(!sc)return;
        (scaleUse[sc.id]=scaleUse[sc.id]||[]).push(s.id);
        if(sc.lic&&sc.lic!=="自編"&&sc.lic!=="—")add("amber",s.id,"license",nm+"「"+sc.name+"」授權："+sc.lic);
        if(sc.val==="self"&&s.type!=="retro"&&sc.kind!=="custom")add("info",s.id,"unvalidated",nm+"「"+sc.name+"」是自編量表，尚未驗證");
        if(sc.val==="needs")add("amber",s.id,"val-needed",nm+"「"+sc.name+"」：繁中版是否等價，還需確認");
        if(sc.only&&s.diseases.indexOf(sc.only)<0)add("amber",s.id,"disease-mismatch",nm+"「"+sc.name+"」是 "+(by(DISEASES,sc.only)||{}).name+" 專用，但計畫沒有這個疾病");});
      if(t.tpl==="pprom"&&!t.scales.some(function(x){var sc=by(SCALES,x.id);return sc&&sc.val==="validated";}))add("amber",s.id,"no-validated",nm+tn+"用的量表都還沒有繁中驗證版");});
    s.diseases.forEach(function(did){var dz=by(DISEASES,did);if(!dz||!dz.mod)return;var has=s.templates.some(function(t){return t.scales.some(function(x){return x.id===dz.mod;});});
      if(!has&&pt.length)add("info",s.id,"disease-hint",nm+"：「"+dz.name+"」常搭配 "+by(SCALES,dz.mod).name);});
  });
  /* 還沒有負責人的量表：每個等級合成一行，不要一個量表一行 */
  var nsA=[],nsI=[];Object.keys(scaleUse).forEach(function(id){var sc0=by(SCALES,id);if(sc0.kind==="custom")return;
    if(!(m.stewards&&m.stewards[id])){var strict=(sc0.lic&&sc0.lic!=="自編"&&sc0.lic!=="—")||sc0.val!=="validated";(strict?nsA:nsI).push(sc0.name);}});
  [["amber",nsA],["info",nsI]].forEach(function(g){if(g[1].length)out.push({level:g[0],study:null,code:"no-steward",n:g[1].length,msg:"還沒有負責人的量表（原文、計分、授權由誰管）："+g[1].join("、")});});
  Object.keys(scaleUse).forEach(function(id){var u=scaleUse[id].filter(function(v,i,a){return a.indexOf(v)===i;});
    if(u.length>1&&by(SCALES,id).kind!=="custom")add("amber",null,"dup-scale","「"+by(SCALES,id).name+"」有 "+u.length+" 個計畫在用，同一位病人可能被問好幾次");});
  if(!hasSys&&!HIDE_IRAE)add("red",null,"no-sys","沒有任何計畫由總 PI 負責");
  var piCount={};m.studies.forEach(function(s){if(s.owner)piCount[s.owner]=(piCount[s.owner]||0)+1;});
  Object.keys(piCount).forEach(function(id){if(piCount[id]>3)add("info",null,"overload",ownerName(m,id)+"同時負責 "+piCount[id]+" 個計畫，工作量可能太大");});
  if(!HIDE_IRAE)add("info",null,"bk","還沒有指定備援系統管理者");   /* 平台層提醒：PI 版沒有 */
  return out;}

/* ---------- 病人時間軸模擬 ---------- */
function ensureNum(v,d){v=Number(v);return isFinite(v)?v:d;}
function gen(cad,off,ctx){var out=[],i;
  switch(cad){
   case "visit":case "perCycle":ctx.visits.forEach(function(v){out.push(v+off);});break;
   case "everyOther":ctx.visits.forEach(function(v,k){if(k%2===0)out.push(v+off);});break;
   case "weekly":for(var d=0;d<=ctx.H;d+=7)if(ctx.E==null||d<=ctx.E+182)out.push(d+off);break;
   case "appB":[0,3,7,14].forEach(function(w){out.push(w*7+off);});
     for(var w2=14+2*ctx.cw;w2*7<=ctx.H;w2+=2*ctx.cw)if(ctx.E==null||w2*7<=ctx.E)out.push(w2*7+off);
     if(ctx.E!=null){out.push(ctx.E+91+off);out.push(ctx.E+182+off);}break;
   default:break;}
  var seen={};return out.filter(function(d){if(d<-7||d>ctx.H+0||seen[d])return false;seen[d]=1;return true;}).sort(function(a,b){return a-b;});}
function simulate(m,p){

  if(UI.focusName){UI.focusName=false;var ni=$(".bstudy .sname");if(ni&&!ni.disabled){ni.focus();ni.select();}}   /* 剛新增的計畫：游標直接停在名稱欄、整段選取，打字就會取代 */
  if(UI.flash){var fl=UI.flash;UI.flash=null;var host=$('.bstudy[data-sid="'+fl.sid+'"]');if(host){var el=host.querySelector('[data-b="'+fl.key+'"]');if(el)el.classList.add("flash");}}
  if(UI.tab==="blocks")requestAnimationFrame(drawLinks);}
function changed(){var had=UI.sid;save();resolveSid();if(had&&UI.sid!==had&&!S.study(M,had))toast("計畫已刪除，已切換到其他計畫");else if(had&&UI.sid!==had)toast("你已不是原本那個計畫的成員，已切換到其他計畫",true);render();}
function denyMsg(sid,mg){return mg?S.DENY_MANAGE:S.DENY_EDIT;}
function afterRes(r,sid){toast(r.msg,!r.ok);if(r.ok)changed();else render();}   /* updateXxx 的結果：失敗要說原因並把畫面還原 */
function stewardWhy(scale,v){var cur=(M.stewards||{})[scale];if(cur&&cur!==UI.actor&&!isPf())return "這份量表已有負責人「"+oname(cur)+"」，只有他本人或系統管理者能更換";if(!cur&&v!==UI.actor&&!isPf())return "還沒有負責人時，只能由你自己擔任（或請系統管理者指派）";return "不能指定這個人當負責人";}

/* ---------- 事件（委派）---------- */
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,sid=b.dataset.sid;
  if(a==="tab"){UI.tab=b.dataset.tab;render();return;}
  if(a==="pick"){UI.sid=sid;UI.overview=false;UI.armed=null;render();return;}
  if(a==="rm"){var kd=b.dataset.kind;if(S.removeItem(M,sid,kd,b.dataset.id,b.dataset.tid,UI.actor))changed();else{var mg0=kd==="owner"||kd==="subpi";if(!(mg0?S.canManage(M,UI.actor,sid):S.canEdit(M,UI.actor,sid))){toast(denyMsg(sid,mg0),true);render();}}return;}
  if(a==="addstudy"){var ns=S.createStudy(M,UI.actor);UI.sid=ns.id;UI.overview=false;UI.focusName=true;changed();toast(ns.owner?"已新增計畫，"+oname(ns.owner)+"是這個計畫的 PI":"已新增計畫（尚未指定 PI）");return;}
  if(a==="delstudy"){if(UI.armed===sid){UI.armed=null;var dr=S.deleteStudy(M,sid,UI.actor);if(dr.ok)changed();else render();toast(dr.msg,!dr.ok);}else{UI.armed=sid;render();setTimeout(function(){if(UI.armed===sid){UI.armed=null;render();}},3500);}return;}
  if(a==="save"){var blob=new Blob([JSON.stringify(M,null,1)],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="ePRO_沙盤存檔_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove();},500);toast("已下載存檔");return;}
  if(a==="copy"){var txt=S.summarize(V(),UI.lastSim||S.simulate(V(),{cycleWeeks:3,horizonWeeks:26,enrolled:enrolledList()}));
    var done=function(ok){toast(ok?"已複製，請貼給"+TO:"無法自動複製，請到「"+(S.HIDE_IRAE?"意見":"決議")+"」分頁手動選取文字",!ok);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true);},function(){fallbackCopy(txt,done);});else fallbackCopy(txt,done);return;}
  if(a==="reset"){if(UI.armed==="reset"){M=S.defaults();UI.armed=null;changed();toast("已重設為範例");}else{UI.armed="reset";b.textContent="再按一次確認重設";setTimeout(function(){if(UI.armed==="reset"){UI.armed=null;b.textContent="重設為範例";}},3500);}return;}});
function fallbackCopy(txt,done){var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;left:-9999px";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();done(ok);}
document.addEventListener("change",function(ev){var b=ev.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,sid=b.dataset.sid,s=sid?S.study(M,sid):null,t=s&&b.dataset.tid?S.tplOf(s,b.dataset.tid):null,v=b.value;
  if(a==="load"){var f=b.files&&b.files[0];if(!f)return;if(f.size>2e6){toast("這個檔案太大，應該不是沙盤存檔",true);return;}var rd=new FileReader();rd.onload=function(){try{var r=S.sanitize(JSON.parse(String(rd.result)));if(!r.ok){toast(r.msg,true);return;}M=r.model;changed();toast("已載入存檔"+(r.dropped?"（有 "+r.dropped+" 項無法讀取，已略過）":""));}catch(e){toast("這不是有效的存檔檔案",true);}};rd.readAsText(f);b.value="";return;}
  if(a==="actor"){UI.actor=v;UI.armed=null;UI.overview=false;render();return;}
  if(a==="overview"){UI.overview=b.checked;render();return;}
  if(a==="addsel"){if(!v)return;var kind={owner:"owner",subpis:"owner",members:"role",diseases:"disease",templates:"template",scales:"scale"}[b.dataset.slot],r=S.place(M,{kind:kind,id:v},{studyId:sid,slot:b.dataset.slot,tid:b.dataset.tid||undefined},UI.actor);toast(r.msg,!r.ok);if(r.ok){UI.flash={sid:sid,key:kind+":"+v};changed();}else render();return;}
  if(a==="combo"&&t){if(!v)return;var rcb=S.applyCombo(M,sid,t.tid,v.split(","),UI.actor);toast(rcb.ok?"已套用推薦組合，原本的量表已換掉":rcb.msg,!rcb.ok);if(rcb.ok){UI.flash={sid:sid,key:"template:"+t.tpl};changed();}else render();return;}
  if(a==="sname"&&s){var r1=S.updateStudy(M,sid,{name:v},UI.actor);if(r1.ok)changed();else{toast(r1.msg,true);render();}return;}
  if(a==="stype"&&s){var r2=S.updateStudy(M,sid,{type:v},UI.actor);if(r2.ok)changed();else{toast(r2.msg,true);render();}return;}
  if(a==="cad"&&t){var r3=S.updateTemplate(M,sid,t.tid,{cadence:v},UI.actor);if(r3.ok)changed();else{toast(r3.msg,true);render();}return;}
  if(a==="venue"&&t){var r4=S.updateTemplate(M,sid,t.tid,{venue:v},UI.actor);if(r4.ok)changed();else{toast(r4.msg,true);render();}return;}
  if(a==="off"&&t){var r5=S.updateTemplate(M,sid,t.tid,{offset:Number(v)},UI.actor);if(r5.ok)changed();else{toast(r5.msg,true);render();}return;}
  if(a==="align"&&t){var r6=S.updateTemplate(M,sid,t.tid,{align:b.checked},UI.actor);if(r6.ok)changed();else{toast(r6.msg,true);render();}return;}
  if(a==="role"&&t){var r7=S.setScaleRole(M,sid,t.tid,b.dataset.id,v,UI.actor);if(r7.ok)changed();else{toast(r7.msg,true);render();}return;}
  if(a==="steward"){if(S.setSteward(M,b.dataset.scale,v,UI.actor))changed();else{toast(stewardWhy(b.dataset.scale,v),true);render();}return;}
  if(a==="oname"){if(!S.canRename(UI.actor,b.dataset.oid)){toast("只能改自己的稱呼（系統管理者可改所有人）",true);render();return;}M.names[b.dataset.oid]=v.trim().slice(0,30);changed();return;}
  if(a==="cust"){M.custody=v;changed();return;}
  if(a==="cap"){M.cap=Number(v);changed();return;}
  if(a==="speed"){M.speed=Math.min(2.5,Math.max(0.5,Number(v)||1));changed();return;}
  if(a==="persona"){UI.persona[b.dataset.f]=v;render();return;}
  if(a==="enr"){var e=enrolledList().slice(),i=e.indexOf(sid);if(b.checked&&i<0)e.push(sid);if(!b.checked&&i>=0)e.splice(i,1);UI.persona.enrolled=e;render();return;}
  if(a==="dec"){if(v)M.decisions[b.dataset.did]=v;else delete M.decisions[b.dataset.did];save();var p=$("#sumpre");if(p)p.textContent=S.summarize(V(),UI.lastSim);return;}
  if(a==="notes"){M.notes=v.slice(0,2000);save();var p2=$("#sumpre");if(p2)p2.textContent=S.summarize(V(),UI.lastSim);return;}});
/* 拖放：整個計畫都是放置區；依拖的種類決定放哪個位置，量表放在哪個模板上就進哪個模板 */
document.addEventListener("dragstart",function(ev){var c=ev.target.closest&&ev.target.closest("[data-d]");if(!c)return;ev.dataTransfer.setData("text/plain",c.dataset.d);ev.dataTransfer.effectAllowed="copyMove";try{document.body.dataset.drag=JSON.parse(c.dataset.d).kind;}catch(e){}});
document.addEventListener("dragover",function(ev){var st=ev.target.closest&&ev.target.closest(".bstudy");if(!st||st.classList.contains("ro"))return;ev.preventDefault();$$(".bstudy.over").forEach(function(x){if(x!==st)x.classList.remove("over");});st.classList.add("over");});
document.addEventListener("dragleave",function(ev){var st=ev.target.closest&&ev.target.closest(".bstudy");if(st&&!st.contains(ev.relatedTarget))st.classList.remove("over");});
document.addEventListener("dragend",function(){delete document.body.dataset.drag;$$(".bstudy.over").forEach(function(x){x.classList.remove("over");});});
document.addEventListener("drop",function(ev){delete document.body.dataset.drag;var st=ev.target.closest&&ev.target.closest(".bstudy");if(!st)return;ev.preventDefault();if(st.classList.contains("ro")){toast("全部計畫是唯讀的，取消勾選後才能編輯",true);return;}st.classList.remove("over");
  var d;try{d=JSON.parse(ev.dataTransfer.getData("text/plain"));}catch(e){return;}
  var slot={owner:"owner",role:"members",disease:"diseases",template:"templates",scale:"scales"}[d.kind];if(!slot)return;
  if(d.kind==="owner"){var sb=ev.target.closest(".sblk");if(sb&&sb.dataset.scale){var okS=S.setSteward(M,sb.dataset.scale,d.id,UI.actor);toast(okS?"已指定量表負責人："+oname(d.id):stewardWhy(sb.dataset.scale,d.id),!okS);if(okS){UI.flash={sid:st.dataset.sid,key:"scale:"+sb.dataset.scale};changed();}return;}
    if(ev.target.closest('[data-slot="subpis"]'))slot="subpis";}
  var blkEl=ev.target.closest(".btpl"),r=S.place(M,d,{studyId:st.dataset.sid,slot:slot,tid:blkEl?blkEl.dataset.tid:undefined},UI.actor);toast(r.msg,!r.ok);if(r.ok){UI.flash={sid:st.dataset.sid,key:d.kind+":"+d.id};changed();}});
/* 鍵盤：Enter 在素材上＝提示用選單 */
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.classList&&ev.target.classList.contains("chip")&&ev.target.closest("#pal"))toast("鍵盤操作請用各計畫位置旁的「＋」選單");});
if(window.matchMedia&&window.matchMedia("(max-width:900px)").matches){var dt=$("#pal");if(dt)dt.open=false;}
window.addEventListener("resize",function(){if(UI.tab==="blocks")drawLinks();});
render();
window.__sbx={get M(){return M;},set M(v){M=v;},UI:UI,render:render,changed:changed};
})();
