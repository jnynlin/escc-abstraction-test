<!-- schema v2 (2026-09-28): 處方選單擴充(暫定,可依藥物重新推導)+ 本線藥物 + 主藥 mg/m² + 口服天數 + 同線修改 + 給付 + 治療時機擴充 -->
<!-- schema v3.6 (2026-09-30): 治療前基礎檢驗值; 病毒性肝炎 HBV/HCV 欄位; 分期影像表單(每次檢查一筆; 病理與檢體 + 生物標記表單、抗癌藥物治療／復發狀態、鞏固化療時機、用語修正(定義性→根治性)、腫瘤涵蓋節段(可複選) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F6F7F5; --sheet:#FFFFFF; --ink:#1E2A32; --soft:#5E6C74; --rule:#D8DEDA; --well:#EEF1EE;
  --done:#1F6B5C; --done-soft:#E1EFEA; --iodine:#8A5A14; --iodine-soft:#F6EBD8;
  --err:#B42318; --err-soft:#FCEBE9; --focus:#2F6FA3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181C; --sheet:#1A2227; --ink:#E4EAEC; --soft:#97A6AD; --rule:#2F3B41; --well:#151D21;
    --done:#6CC3AC; --done-soft:#17302A; --iodine:#E0B56C; --iodine-soft:#33291A;
    --err:#F2877C; --err-soft:#3A1F1C; --focus:#7FB4E0;
  }
}
:root[data-theme="dark"]{
  --paper:#12181C; --sheet:#1A2227; --ink:#E4EAEC; --soft:#97A6AD; --rule:#2F3B41; --well:#151D21;
  --done:#6CC3AC; --done-soft:#17302A; --iodine:#E0B56C; --iodine-soft:#33291A;
  --err:#F2877C; --err-soft:#3A1F1C; --focus:#7FB4E0;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

/* bar */
.bar{position:sticky;top:0;z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top,0px) + 9px) 16px 9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.bar h1{margin:0;font-size:1rem;font-weight:600;letter-spacing:.01em;}
.bar .sp{flex:1;}
.bar label{font-size:.82rem;color:var(--soft);}
.bar input{width:120px;padding:6px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.bar input.need{border-color:var(--err);background:var(--err-soft);}
.btn{padding:6px 12px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);font-size:.86rem;font-weight:500;white-space:nowrap;}
.btn.go{background:var(--done);border-color:var(--done);color:#fff;}
:root[data-theme="dark"] .btn.go{color:#0E1714;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#0E1714;}}
.btn.warn{color:var(--err);border-color:var(--err);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.menu{position:relative;}
.menu .dd{position:absolute;right:0;top:calc(100% + 4px);min-width:230px;background:var(--sheet);border:1px solid var(--rule);
  border-radius:7px;padding:4px;display:none;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.14);}
.menu.open .dd{display:block;}
.menu .dd button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:5px;font-size:.88rem;}
.menu .dd button:hover{background:var(--well);}
.menu .dd hr{border:none;border-top:1px solid var(--rule);margin:4px 0;}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px);}
@media (max-width:880px){.shell{grid-template-columns:1fr;}}
.rail{border-right:1px solid var(--rule);background:var(--sheet);padding:14px 14px 20px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);height:calc(100vh - 53px);display:flex;flex-direction:column;overflow:hidden;}
@media (max-width:880px){.rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);}}
.meter{margin:0 0 12px;}
.meter .row{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft);margin-bottom:4px;}
.meter .row b{color:var(--ink);font-weight:600;}
.track{height:6px;border-radius:3px;background:var(--well);overflow:hidden;}
.track i{display:block;height:100%;background:var(--done);width:0;transition:width .3s;}
@media (prefers-reduced-motion: reduce){.track i{transition:none;}}
.queues{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px;}
.queues button{border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:3px 10px;font-size:.78rem;color:var(--soft);}
.queues button.on{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--well);}
.queues button span{margin-left:4px;color:var(--soft);font-weight:400;}
.rail input.q{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);margin-bottom:8px;}
.list{overflow:auto;flex:1;margin:0 -6px;padding:0 6px;}
@media (max-width:880px){.list{max-height:240px;}}
.pt{display:grid;grid-template-columns:auto 1fr auto;gap:0 9px;align-items:center;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:6px;padding:7px 8px;}
.pt:hover{background:var(--well);}
.pt.cur{border-color:var(--ink);background:var(--well);}
.pt .dots{display:flex;gap:3px;}
.pt .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);}
.pt .dots i.s1{background:var(--iodine);} .pt .dots i.s2{background:var(--done);} .pt .dots i.bad{background:var(--err);}
.pt b{font-weight:600;font-size:.9rem;}
.pt small{color:var(--soft);font-size:.76rem;}
.empty{color:var(--soft);font-size:.88rem;padding:18px 4px;}
.legend{font-size:.72rem;color:var(--soft);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;}

/* main */
main{padding:18px 22px 130px;max-width:1040px;width:100%;}
@media (max-width:600px){main{padding:14px 12px 150px;}}
.spine{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:6px;padding:12px 16px;margin-bottom:14px;}
.spine h2{margin:0 0 6px;font-size:1.25rem;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.spine h2 small{font-size:.82rem;font-weight:400;color:var(--soft);}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;margin:0;}
.facts div{min-width:0;}
.facts dt{font-size:.72rem;color:var(--soft);}
.facts dd{margin:0;font-size:.9rem;font-weight:500;overflow-wrap:anywhere;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto;}
.tabs button{border:none;background:none;padding:9px 12px;font-size:.88rem;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600;}
.tabs button i{width:7px;height:7px;border-radius:50%;background:var(--rule);}
.tabs button i.s1{background:var(--iodine);} .tabs button i.s2{background:var(--done);}
.tabs button em{font-style:normal;font-size:.74rem;color:var(--soft);}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:4px 18px 10px;}
.sheet h3{font-size:.92rem;font-weight:600;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule);color:var(--ink);}
.sheet h3:first-child{border-top:none;padding-top:4px;}
.desc{font-size:.86rem;color:var(--soft);margin:10px 0 4px;}
.f{padding:7px 0;display:grid;grid-template-columns:minmax(160px,34%) 1fr;gap:4px 16px;align-items:start;}
@media (max-width:640px){.f{grid-template-columns:1fr;}}
.f > .lab{font-size:.88rem;padding-top:5px;}
.f > .lab i{color:var(--err);font-style:normal;margin-left:3px;}
.f > .lab small{display:block;color:var(--soft);font-size:.74rem;line-height:1.4;margin-top:2px;}
.f .in{min-width:0;}
.f input[type=text],.f select,.f textarea{width:100%;max-width:340px;padding:6px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.f textarea{max-width:none;min-height:64px;resize:vertical;}
.f .hint{font-size:.76rem;color:var(--soft);margin-top:3px;}
.f .msg{font-size:.78rem;margin-top:3px;}
.f .msg:empty,.f .hint:empty{display:none;}
.f.e .msg{color:var(--err);} .f.e input,.f.e select,.f.e .opts{border-color:var(--err);}
.f.w .msg{color:var(--iodine);}
.f.flash{animation:fl 1.1s ease;}
@keyframes fl{0%,40%{background:var(--iodine-soft);}100%{background:transparent;}}
@media (prefers-reduced-motion: reduce){.f.flash{animation:none;}}
.opts{display:flex;flex-wrap:wrap;gap:5px;border:1px solid transparent;border-radius:6px;}
.opts button{border:1px solid var(--rule);background:var(--well);border-radius:5px;padding:5px 10px;font-size:.86rem;text-align:left;}
.opts button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet);}
.calc{padding:6px 9px;border:1px dashed var(--rule);border-radius:5px;min-height:34px;max-width:340px;font-weight:600;}
.calc:empty::before{content:"—";color:var(--soft);font-weight:400;}
.inst{border:1px solid var(--rule);border-radius:6px;margin:12px 0;background:var(--sheet);}
.inst > .ih{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--well);border-radius:6px 6px 0 0;}
.inst > .ih b{font-weight:600;font-size:.9rem;}
.inst > .ih span{color:var(--soft);font-size:.82rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inst > .ib{padding:4px 14px 8px;}
.addrow{margin:10px 0 4px;}
.nodata{padding:40px 10px;text-align:center;color:var(--soft);}
.nodata h2{color:var(--ink);font-size:1.1rem;font-weight:600;margin:0 0 8px;}
.nodata ol{text-align:left;display:inline-block;margin:10px 0 16px;}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--rule);
  padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));}
.dock .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1340px;margin:0 auto;}
.dock .st{font-size:.84rem;color:var(--soft);}
.dock .st b{color:var(--ink);font-weight:600;}
.pill{border:none;border-radius:12px;padding:3px 10px;font-size:.8rem;font-weight:600;}
.pill.e{background:var(--err-soft);color:var(--err);} .pill.w{background:var(--iodine-soft);color:var(--iodine);} .pill.ok{background:var(--done-soft);color:var(--done);}
.dock .sp{flex:1;}
.issues{max-width:1340px;margin:6px auto 0;max-height:32vh;overflow:auto;display:none;}
.issues.open{display:block;}
.issues button{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--rule);padding:6px 2px;font-size:.84rem;}
.issues button b{margin-right:6px;}
.issues button.e b{color:var(--err);} .issues button.w b{color:var(--iodine);}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:16px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;}
#toast.show{opacity:1;}
#modal{position:fixed;inset:0;background:rgba(10,18,22,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:18px;}
#modal.open{display:flex;}
#modal .box{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;max-width:460px;width:100%;}
#modal p{margin:0 0 14px;white-space:pre-line;}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;}
input[type=file]{display:none;}

.bar select{padding:6px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.meter .row span b{color:var(--ink);font-weight:600;}
.pt small.tag{font-size:.72rem;}
.pt small.tag.opn{color:var(--iodine);font-weight:600;}
.pt small.tag.ret{color:var(--err);font-weight:600;}
.banner{border-radius:6px;padding:9px 14px;margin:-4px 0 14px;font-size:.86rem;}
.banner.ok{background:var(--done-soft);color:var(--done);}
.banner.aud{background:var(--iodine-soft);color:var(--iodine);}
.tabs b.qn{background:var(--iodine);color:var(--sheet);border-radius:9px;font-size:.7rem;padding:0 6px;font-weight:600;}
.qbtn{display:inline-block;margin-top:5px;border:1px dashed var(--rule);background:none;border-radius:10px;padding:1px 9px;font-size:.72rem;color:var(--soft);}
.qbtn:hover{border-color:var(--iodine);color:var(--iodine);}
.qbtn.on{border-style:solid;border-color:var(--iodine);color:var(--iodine);font-weight:600;}
.f.hasq{background:linear-gradient(90deg,var(--iodine-soft),transparent 60%);margin:0 -18px;padding-left:18px;padding-right:18px;}
.qbox{margin-top:8px;border-left:3px solid var(--iodine);background:var(--well);border-radius:0 6px 6px 0;padding:8px 12px;font-size:.84rem;max-width:560px;}
.qbox.ret{border-left-color:var(--err);}
.qbox.closed{border-left-color:var(--done);opacity:.85;}
.qbox .qh{font-weight:600;margin-bottom:4px;}
.qbox ul{margin:0;padding-left:18px;}
.qbox li{margin:2px 0;}
.qbox li small{display:block;color:var(--soft);font-size:.72rem;}
.qacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.srcrow{background:var(--well);border-radius:6px;padding:7px 10px !important;margin:2px 0 6px;}
.srcin{display:flex;gap:8px;flex-wrap:wrap;}
.srcin select{max-width:200px !important;}
.srcin input{max-width:190px !important;}
.small{font-size:.8rem;margin-top:14px;}
#modal .box h3{margin:0 0 10px;font-size:1rem;}
.mf{display:block;margin:0 0 10px;}
.mf span{display:block;font-size:.82rem;color:var(--soft);margin-bottom:3px;}
.mf i{color:var(--err);font-style:normal;}
.mf select,.mf input,.mf textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--well);}
.mf textarea{min-height:70px;resize:vertical;}
.merr{color:var(--err);font-size:.82rem;margin:0 0 8px;min-height:0;}
.merr:empty{display:none;}
.report .tw{overflow-x:auto;}
.report table{border-collapse:collapse;width:100%;font-size:.86rem;margin:6px 0 14px;}
.report th,.report td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;}
.report th{color:var(--soft);font-weight:500;}
.report tr.lo td{color:var(--err);}
body[data-role="physician"] .bar{border-bottom:3px solid var(--done);}
body[data-role="auditor"] .bar{border-bottom:3px solid var(--iodine);}
/* v3.1 contrast overrides */
:root{--soft:#3F4C53;--rule:#C3CCC8;--well:#EAEFEC;}
@media (prefers-color-scheme: dark){:root{--soft:#B7C4CA;--rule:#4A5860;--well:#1C262B;}}
html{font-size:17px;}
.desc,.hint,.lab small,.pt small,.tag,.chip,.afoot{font-size:.84rem;}
.lab{font-size:.94rem;font-weight:500;}
.lab small{color:var(--soft);}
.opts button{border-color:#9AA8A3;background:#FFFFFF;color:var(--ink);font-size:.9rem;}
.opts button.on{background:#0D6468;border-color:#0D6468;color:#FFFFFF;box-shadow:inset 0 0 0 2px #FFFFFF,0 0 0 2px #0D6468;}
input[type=text],select,textarea{border-color:#9AA8A3;color:var(--ink);font-size:.95rem;}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid #2F6FA3;outline-offset:1px;}
.pill{border:1px solid rgba(0,0,0,.12);}
.tabs button{color:#3F4C53;font-size:.92rem;} .tabs button.on{color:#0D6468;border-bottom:3px solid #0D6468;}
#queues button.on,.qb.on{background:#0D6468;color:#fff;border-color:#0D6468;}
.pt.on{outline:2px solid #0D6468;}
.btn{font-weight:600;border-color:#9AA8A3;} .btn.go{background:#0D6468;border-color:#0D6468;color:#fff;}
h3{font-size:1rem;color:var(--ink);}
.spine{border-left:5px solid #0D6468;}
.msg{font-weight:600;}
@media (prefers-color-scheme: dark){.opts button{background:#1C262B;border-color:#5A6A72;color:var(--ink);} input[type=text],select,textarea{background:#151D21;border-color:#5A6A72;}}

/* ---- PROM 症狀清單（移植 clinic-epro v2 專業端；色票用工作台 token，一色一義：紅=今日必辦、紫=人講的話、琥珀=注意、灰=判不出來） ---- */
.prom-only .rail,.prom-only #menu,.prom-only #dock,.prom-only #bAssign{display:none!important;} .prom-only .shell{display:block;}
.prom-view .rail{display:none!important;} .prom-view .shell{display:block;}
.pm-shell{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;align-items:start;} @media (max-width:880px){.pm-shell{grid-template-columns:1fr;}}
.pm-rail{position:sticky;top:8px;max-height:calc(100vh - 90px);overflow:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px;} .pm-list table{width:100%;border-collapse:collapse;}
.prom .seg{display:inline-flex;border:1px solid #9AA8A3;border-radius:8px;overflow:hidden;} .prom .seg .fbtn{border:0;border-radius:0;border-right:1px solid #9AA8A3;} .prom .seg .fbtn:last-child{border-right:0;}
.prom .pm-scope{font:inherit;font-size:.84rem;padding:4px 6px;border:1px solid #9AA8A3;border-radius:6px;background:var(--sheet);color:var(--ink);max-width:100%;} .prom .pm-skip{flex-basis:100%;}
.prom tr.pgrp td{padding:10px 4px 3px;font-size:.76rem;color:var(--soft);letter-spacing:.04em;} .prom tr.prow td{padding:7px 5px;border-top:1px solid var(--rule);vertical-align:top;} .prom tr.prow.on td{background:var(--iodine-soft);} .prom tr.prow:hover td{background:var(--well);}
.prom tr.prow td:first-child{width:16px;padding-top:12px;} .prom .c3{text-align:right;white-space:nowrap;width:76px;} .prom .why1{font-size:.86rem;color:var(--ink);line-height:1.35;margin-top:2px;} .prom .m{font-size:.78rem;color:var(--soft);} .prom .age{font-size:.78rem;color:var(--soft);}
.prom .t-dc{background:var(--well);color:var(--soft);font-size:.72rem;}
/* 手機（≤880px，2026-10-08 user：iPhone 背景可移動、前景擋住）：病人清單不再黏住畫面（原本佔 89% 高、細節在後面捲），改成固定高度的獨立捲動框；上方列在窄螢幕不黏；輸入框 16px 免 iOS 自動放大 */
/* 手機第二版（2026-10-08 user：Android 也卡——上下框、內外框捲軸）：整頁只有一個捲軸；清單與細節一次只顯示一個（點病人進細節、「← 回清單」回去）；下方按鈕列不黏；分組框改扁平 */
.pm-mwrap{min-width:0;} .pm-mback{display:none;}

/* ---------- date parsing (民國／西元) ---------- */
function parseDate(raw){
  var s=String(raw||"").trim();if(!s)return {iso:""};
  s=s.replace(/^民國/,"").replace(/\s+/g,"").replace(/[年月]/g,"/").replace(/日$/,"").replace(/[.\-]/g,"/");
  var m,y,mo,d;
  if((m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/))){y=+m[1];mo=+m[2];d=+m[3];}
  else if((m=s.match(/^(\d{2,3})\/(\d{1,2})\/(\d{1,2})$/))){y=+m[1]+1911;mo=+m[2];d=+m[3];}
  else if((m=s.match(/^((?:19|20)\d{2})(\d{2})(\d{2})$/))){y=+m[1];mo=+m[2];d=+m[3];}
  else if((m=s.match(/^(\d{2,3})(\d{2})(\d{2})$/))){y=+m[1]+1911;mo=+m[2];d=+m[3];}
  else return {iso:"",err:1};
  var dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return {iso:"",err:1};
  return {iso:y+"-"+pad(mo)+"-"+pad(d)};
}

    if(forComplete&&oq.length)oq.forEach(function(q){E.push({f:q.f,m:"有未結案的問題（"+Q_STATUS[q.status]+"）"});});

var STALE_DAYS=90;

  if(st==="2"){a=dnum3(c.sys_tx_asof);if(a===null||now-a>STALE_DAYS)return true;}
  if(rs==="2"){b=dnum3(c.recur_asof);if(b===null||now-b>STALE_DAYS)return true;}return false;}

function xcheck(id,fm,inst,forComplete,E,W){

    if(st==="3"&&n)E.push({f:"sys_tx_status",m:"已登錄 "+n+" 條治療線，不能選「確認無抗癌藥物治療」"});
    if(st==="2"&&n)W.push({f:"sys_tx_status",m:"已登錄治療線，狀態應改為「有」"});
    if(st==="1"&&!n&&forComplete)W.push({f:"sys_tx_status",m:"狀態為「有」但尚未登錄任何治療線"});
    var rs=r.core_abstraction.recur_status,ne=(r.clin_event||[]).filter(function(e){return ["1","2","3","4","5"].indexOf(e.ev_type)>=0;}).length;
    if(rs==="3"&&ne)E.push({f:"recur_status",m:"已登錄復發／惡化事件，不能選「確認無復發」"});
    if(rs==="1"&&!ne&&forComplete)W.push({f:"recur_status",m:"狀態為「有」但尚未登錄復發事件"});
    var up=parseFloat(r.core_abstraction.tumor_upper_cm),lo=parseFloat(r.core_abstraction.tumor_lower_cm),segs=r.core_abstraction.tumor_segments||[];
    if(!isNaN(up)&&!isNaN(lo)&&lo>=up){var need=segsFromCm(up,lo),miss=need.filter(function(k){return segs.indexOf(k)<0;});

      if(!segs.length&&forComplete)W.push({f:"tumor_segments",m:"依距離建議勾選："+need.map(function(k){return SEG_NAME[k];}).join("、")});}}

      if((set==="2"||set==="7")&&!overlap)W.push({f:"line_setting",m:"選「同步放化療」但化療期間與任何放療療程皆無重疊，請核對日期"});

function recordState(id){

function askQuestion(fm,inst,f){
  if(!needWho())return;
  if(role()!=="abstractor"){toast("問題由登錄人員提出；醫師請直接在問題框內裁定");return;}
  var ex=qFor(cur,fm.id,inst,f.v);
  if(ex&&(ex.status==="open"||ex.status==="returned")){toast("此欄已有未結案的問題");return;}
  var cv=srcOf(fm,inst)[f.v];
  dialog({title:"送醫師確認："+f.l,msg:"目前值："+valText(f,cv),fields:[
    {k:"type",label:"問題類型",type:"select",options:Q_TYPES,req:1},
    {k:"note",label:"說明（看到了什麼、在哪份文件、哪一天）",type:"textarea",req:1},
    {k:"to",label:"指派醫師（可空白＝任何醫師）",type:"text",value:lsGet("escc-abstraction-lastdoc-name")}],ok:"送出"}).then(function(v){
    if(!v)return;lsSet("escc-abstraction-lastdoc-name",v.to||"");
    var q={id:"Q"+(DB.q.length+1)+"-"+Date.now().toString(36).slice(-4),sid:cur,form:fm.id,inst:instKey(inst),f:f.v,cur:cv==null?"":cv,type:v.type,note:v.note,by:who(),at:stamp(),to:v.to||"",status:"open",
      thread:[{by:who(),at:stamp(),act:"ask",note:v.type+"："+v.note,value:cv==null?"":cv}]};
    DB.q.push(q);logChange(fm.id,"提問「"+f.l+"」："+v.note);persist(true);renderForm();refreshCur();toast("已送醫師確認");
  });
}
function qAction(qid,act,fm,inst,f){
  if(!needWho())return;
  var q=DB.q.filter(function(x){return x.id===qid;})[0];if(!q)return;
  var cv=formSrc(q.sid,q.form,inst,"main")[q.f];
  var need=act==="return"||act==="unknown"||act==="resend";
  var labels={confirm:"確認原值（"+valText(f,cv)+"）",correct:"確認更正後的值（"+valText(f,cv)+"）",unknown:"判定病歷無法確認",return:"退回登錄人員補查",resend:"補查完成，再送醫師",withdraw:"撤回這個問題"};
  if(act==="correct"&&JSON.stringify(cv==null?"":cv)===JSON.stringify(q.cur)){toast("請先在上方欄位改成正確的值，再按「已在上方更正」");return;}
  dialog({title:labels[act],fields:[{k:"note",label:need?"說明（必填）":"說明（選填）",type:"textarea",req:need?1:0}],ok:"確定"}).then(function(v){
    if(!v)return;
    var entry={by:who(),at:stamp(),act:act,note:v.note||""};
    if(act==="confirm"||act==="correct"||act==="unknown"){entry.value=cv==null?"":cv;q.status="closed";q.decision=act;q.final=cv==null?"":cv;q.closedBy=who();q.closedAt=stamp();}
    else if(act==="return")q.status="returned";
    else if(act==="resend"){q.status="open";q.cur=cv==null?"":cv;entry.value=q.cur;}
    else if(act==="withdraw")q.status="withdrawn";
    q.thread.push(entry);
    logChange(q.form,"問題「"+f.l+"」"+(Q_ACT[act]||act)+(v.note?"："+v.note:""));
    persist(true);renderForm();refreshCur();renderMain();toast(Q_ACT[act]+"完成");
  });
}

var AUD_FIELDS=[];FORMS.filter(function(f){return f.audit;}).forEach(function(fm){(BYFORM[fm.id]||[]).forEach(function(f){if(editable(f)&&f.t!=="notes"&&!/_verified$/.test(f.v))AUD_FIELDS.push(f);});});
function drawSample(){
  refreshStates();
  var pool=DB.order.filter(function(id){return STATE[id]&&STATE[id].core_abstraction===2&&DB.audSample.indexOf(id)<0;});
  if(!pool.length){toast("目前沒有已完成核心補登、且尚未抽過的病人");return;}
  var n=Math.max(1,Math.round(pool.length*0.05));
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  pool.slice(0,n).forEach(function(id){DB.audSample.push(id);audOf(id);});
  persist(true);refreshStates();renderRail();
  ask("已從 "+(pool.length)+" 位已完成核心補登的病人中隨機抽出 "+n+" 位（5%）。請由另一位人員切換身分為「稽核員」重摘。",true);
}
function agree(f,a,b){
  var ea=a==null||a===""||(Array.isArray(a)&&!a.length),eb=b==null||b===""||(Array.isArray(b)&&!b.length);
  if(ea&&eb)return true;if(ea!==eb)return false;
  if(Array.isArray(a)||Array.isArray(b))return JSON.stringify((a||[]).slice().sort())===JSON.stringify((b||[]).slice().sort());
  if(f.val==="number"||f.val==="integer"){var tol=/_cm$/.test(f.v)?1:(/pct/.test(f.v)?2:0);return Math.abs(+a-+b)<=tol;}
  return String(a)===String(b);
}
function kappa(pairs){
  var n=pairs.length;if(n<2)return null;
  var po=pairs.filter(function(p){return p[0]===p[1];}).length/n,ca={},cb={};
  pairs.forEach(function(p){ca[p[0]]=(ca[p[0]]||0)+1;cb[p[1]]=(cb[p[1]]||0)+1;});
  var pe=0;Object.keys(ca).forEach(function(k){pe+=(ca[k]/n)*((cb[k]||0)/n);});
  return pe===1?null:(po-pe)/(1-pe);
}
function auditReport(){
  var ids=DB.audSample.filter(function(id){return DB.aud[id]&&DB.aud[id].done;});
  var rows=[],dis=[];
  AUD_FIELDS.forEach(function(f){
    var pairs=[],ag=0,n=0;
    ids.forEach(function(id){
      var fmId=f.f,orig=recOf(id)[fmId]||{},au=DB.aud[id].data[fmId]||{};
      var vo=visible(id,f,null,"main"),va=visible(id,f,null,"audit");if(!vo&&!va)return;
      var a=vo?orig[f.v]:"",b=va?au[f.v]:"";n++;
      if(agree(f,a,b))ag++;else dis.push({id:id,f:f,a:a,b:b});
      if(f.t==="radio"||f.t==="yesno"||f.t==="dropdown")pairs.push([String(a==null?"":a),String(b==null?"":b)]);
    });
    if(n)rows.push({f:f,n:n,pct:ag/n,k:kappa(pairs)});
  });
  return {ids:ids,rows:rows,dis:dis};
}

/* ---------- CSV ---------- */
function parseCSV(t){
  t=t.replace(/^\ufeff/,"");var rows=[],row=[],cell="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}
function csvCell(v){v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

function csvCell(v){v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function loadCsv(text){
  var rows=parseCSV(text);if(rows.length<2){toast("CSV 沒有資料列");return;}
  var h=rows[0].map(function(x){return x.trim();});
  if(h.indexOf("record_id")<0||h.indexOf("tx_pathway")<0){toast("非預填檔：缺少 record_id 或 tx_pathway 欄");return;}
  var add=0,upd=0;
  if(h.indexOf("mrn")<0){var okNoMrn=confirm("這份預填檔沒有「病歷號(mrn)」欄位，助理將無法調閱病歷。只有測試假資料才適合這樣載入。仍要載入？");if(!okNoMrn){toast("已取消載入");return;}}
  rows.slice(1).forEach(function(r){var o={};h.forEach(function(k,i){if(PREFILL.indexOf(k)>=0||k==="mrn")o[k]=(r[i]||"").trim();});
    if(!o.record_id)return;if(DB.pre[o.record_id])upd++;else{add++;DB.order.push(o.record_id);}DB.pre[o.record_id]=o;});
  DB.order.sort(function(a,b){var ya=+DB.pre[a].dx_year,yb=+DB.pre[b].dx_year;return ya-yb||(a<b?-1:1);});
  persist(true);refreshStates();renderRail();renderMain();
  ask("已載入預填資料：新增 "+add+" 位"+(upd?"，更新 "+upd+" 位（已摘錄的內容保留）":"")+"。",true);
}
function redcapCsv(){
  var cols=["record_id","redcap_repeat_instrument","redcap_repeat_instance"];
  FORMS.forEach(function(fm){(BYFORM[fm.id]||[]).forEach(function(f){if(!isData(f))return;
    if(f.t==="checkbox")f.ch.forEach(function(c){cols.push(f.v+"___"+c[0]);});else cols.push(f.v);});cols.push(fm.id+"_complete");});
  var lines=[cols.join(",")];
  DB.order.forEach(function(id){
    var r=DB.rec[id];if(!r)return;
    var base={record_id:id,redcap_repeat_instrument:"",redcap_repeat_instance:""},has=false;
    FORMS.filter(function(fm){return !fm.rep;}).forEach(function(fm){var src=r[fm.id];if(!src||!src._s)return;has=true;fill(base,fm,src,null,id);base[fm.id+"_complete"]=src._s===2?2:0;});
    if(has)lines.push(cols.map(function(c){return csvCell(base[c]);}).join(","));
    FORMS.filter(function(fm){return fm.rep;}).forEach(function(fm){(r[fm.id]||[]).forEach(function(x,i){
      var o={record_id:id,redcap_repeat_instrument:fm.id,redcap_repeat_instance:i+1};fill(o,fm,x,x,id);o[fm.id+"_complete"]=x._s===2?2:0;
      lines.push(cols.map(function(c){return csvCell(o[c]);}).join(","));});});
  });
  return "\ufeff"+lines.join("\r\n");
  function fill(o,fm,src,inst,id){(BYFORM[fm.id]||[]).forEach(function(f){if(!isData(f))return;
    var v=visible(id,f,inst,"main")?src[f.v]:"";
    if(f.t==="checkbox")f.ch.forEach(function(c){o[f.v+"___"+c[0]]=Array.isArray(v)&&v.indexOf(c[0])>=0?1:0;});else o[f.v]=v==null?"":v;});}
}
function redcapImportFiles(rowsPerFile){
  rowsPerFile=rowsPerFile||400;
  var SK={},seenF={};SCHEMA.forEach(function(f){if(f.f==="registry_prefill")return;if(f.sec||!seenF[f.f]){SK[f.f+"|"+f.v]=("src_"+f.v).slice(0,26);seenF[f.f]=1;}});
  var cols=["record_id","redcap_repeat_instrument","redcap_repeat_instance"];
  FORMS.forEach(function(fm){(BYFORM[fm.id]||[]).forEach(function(f){var k=SK[fm.id+"|"+f.v];if(k){cols.push(k+"_t");cols.push(k+"_d");}if(!isData(f))return;
    if(f.t==="checkbox")f.ch.forEach(function(c){cols.push(f.v+"___"+c[0]);});else cols.push(f.v);});cols.push(fm.id+"_complete");});
  function fill(o,fm,src,inst,id){(BYFORM[fm.id]||[]).forEach(function(f){if(!isData(f))return;var v=visible(id,f,inst,"main")?src[f.v]:"";
    if(f.t==="checkbox")f.ch.forEach(function(c){o[f.v+"___"+c[0]]=Array.isArray(v)&&v.indexOf(c[0])>=0?1:0;});else o[f.v]=v==null?"":v;});

:"食道","term":"Dysphagia","class":"both","addon":null,"status":"pi_approved_20261001","q":[{"id":"present","type":"yesno","text":"吃東西或喝水的時候，有沒有卡住、吞不下去的感覺？"},{"id":"diet","type":"choice","text":"現在吃得下什麼？","opts":["跟平常一樣，什麼都能吃","要切小塊或吃軟的才吞得下","只吞得下流質（湯、牛奶、營養品）","連水都吞不下去"],"when":"present","gmap":[1,2,2,3],"hint":"請選最符合您現在吃東西狀況的一項;不確定就選比較接近的,醫師看診時會再問您。","hint_clin":"對應 CTCAE 吞嚥困難分級錨點：有症狀但正常飲食／飲食改變／嚴重改變。「只能吞流質」算第二或第三級待 PI 審。"},{"id":"tube","type":"yesno","text":"現在有沒有用鼻胃管或胃造口（灌食）進食？"},{"id":"pain_swallow","type":"yesno","text":"吞的時候會不會痛？","when":"present"},{"id":"pain_sev","type":"choice","text":"吞痛的程度？","opts":["不痛","輕微","中等","嚴重（痛到不敢吞）"],"when":"pain_swallow","gmap":[0,1,2,3]},{"id":"choke","type":"yesno","text":"吃東西或喝水的時候會不會嗆到、咳起來？","when":"present","hint":"嗆咳是食物或水跑錯地方（吸入）的警訊。"},{"id":"hemoptysis","type":"yesno","text":"有沒有咳出血或吐出血？","hint":"這一題很重要，有的話請一定要勾。","hint_clin":"這一題是安全題，勾了會直接亮紅旗。"}],"also":["Aspiration","Esophageal pain","Esophagitis"],"red_priority":"high","note":"食道癌的定義性症狀。Dysphagia 第三級的條件之一是「已用管灌／全靜脈營養」,這是病人答得出來的事實;「只吞得下流質」是否算嚴重改變是臨床判斷,下限 2 上限 3。Esophagitis 第一級無症狀,問卷不能排除,且與腫瘤本身的吞嚥困難分不開,只做觸發。連水都吞不下去直接亮紅旗(阻塞、脫水、吸入)。 v4(2026-10-01, PI D1):加嗆咳(Aspiration 觸發)與咳血(紅旗),承接退場的 NewDx 表單症狀段。"},{"id":"weight","label":"體重","icon":"⚖️","organ":"營養","term":"Weight loss","class":"both","addon":null,"status":"pi_approved_20261001","q":[{"id":"now_kg","type":"number","text":"現在的體重大約幾公斤？（最近量的就好）","unit":"kg","min":20,"max":200,"step":0.5,"hint":"治療前的體重由工作人員在登錄時填好，系統會算減輕的百分比。"},{"id":"baseline_kg","type":"number","text":"治療前體重（工作人員於登錄時填）","unit":"kg","min":20,"max":200,"step":0.5,"staff":true}],"note":"Weight loss 是病人能獨力定案的詞條:只看比基準減少的百分比(5／10／20%),基準是治療前體重不是上次回診。長輩不易自報治療前體重,所以基準由工作人員填。"},{"id":"pain","label":"疼痛","icon":"⚡","organ":"全身","term":"Pain","class":"both","addon":null,"status":"pi_review_20261001_site_pictorial","q":[{"id":"present","type":"yesno","text":"身體有沒有哪裡在痛？"},{"id":"site","type":"choice","text":"最痛的地方？","opts":["胸口／胸骨後","背部","上腹部","喉嚨／頸部","骨頭或關節","其他"],"when }
function crit(t,g){ var d=CT.terms[t]; return (d&&d.grades[String(g)])||'' }

}

function env(term,floor,ceiling,basis,missing,triggers,note){

  floor=Math.max(0,Math.min(floor,ceiling));

    basis:basis||'',basis_text:floor?crit(term,floor):'',

function g(ev){
  var cur=ev;
  for(var i=1;i<arguments.length;i++){
    if(!cur||typeof cur!=='object'||!(arguments[i] in cur)) return null;
    cur=cur[arguments[i]];
  }
  return (cur===null||cur===undefined||cur==='')?null:cur;
}
function gmap(item,key,v){
  if(v===null||v===undefined) return null;
  for(var i=0;i<PANEL.items.length;i++){
    var it=PANEL.items[i]; if(it.id!==item) continue;
    for(var j=0;j<(it.q||[]).length;j++){
      var q=it.q[j];
      if(q.id===key&&q.gmap) return (v>=0&&v<q.gmap.length)?q.gmap[v]:null;
    }
  }
  return v;
}
function attr(ev,key,item){
  if(!g(ev,key)) return false;
  var by=g(ev,key+'_by')||[];
  return by.indexOf(item)>=0;
}

/* ---- 各詞條規則。逐條對照 grading.py，不重新設計。 ---- */
function _fatigue(ev){
  var t='Fatigue', p=g(ev,'fatigue','present');
  if(p===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!p) return env(t,0,0,'無疲倦即無此不良事件');
  var relieved=(g(ev,'fatigue','rest')===0);
  var ai=attr(ev,'adl_i','fatigue'), as=attr(ev,'adl_s','fatigue');
  if(!relieved && as) return env(t,3,3,'G3');
  if(!relieved || ai || as) return env(t,2,2,'G2');
  return env(t,1,1,'G1');
}
function _fever(ev){
  var t='Fever', p=g(ev,'fever','present');
  if(p===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!p) return env(t,0,0,'無發燒');
  var miss=['白血球/嗜中性球數值(發燒性嗜中性球低下為另一詞條 Febrile neutropenia)'];
  var temp=g(ev,'fever','temp');
  if(temp===null) return env(t,1,maxg(t),'G1',
    ['實際量到的體溫數字 —— 這個詞條的分級只看溫度與時間'].concat(miss));
  if(temp<38.0) return env(t,0,0,'未達 38 度');
  if(temp<=39.0) return env(t,1,1,'G1',miss);
  if(temp<=40.0) return env(t,2,2,'G2',miss);
  var o=g(ev,'fever','over24');
  if(o===null) return env(t,3,4,'G3',['超過 40 度是否持續逾 24 小時'].concat(miss));
  return env(t,o?4:3,o?4:3,o?'G4':'G3',miss);
}
function _diarrhea(ev){
  var t='Diarrhea';
  var base=g(ev,'diarrhea','baseline'), now=g(ev,'diarrhea','now');
  var cons=g(ev,'diarrhea','consistency');
  var ai=attr(ev,'adl_i','diarrhea'), as=attr(ev,'adl_s','diarrhea');
  var miss=['是否需要靜脈輸液或住院(病人無法判斷)','歸因:免疫性腸炎、感染、藥物或疾病本身'];
  var delta=(base!==null&&now!==null)?(now-base):null;
  if(delta===null) miss.unshift('平常一天幾次與最近最多一天幾次(CTCAE 算的是比基準線多幾次)');
  if((delta!==null&&delta>=7)||as) return env(t,3,maxg(t),'G3',miss);
  if((delta!==null&&delta>=4&&delta<=6)||ai) return env(t,2,maxg(t),'G2',miss);
  if(cons||(delta!==null&&delta>=1)) return env(t,1,maxg(t),'G1',miss);
  if(delta===0&&cons===0) return env(t,0,0,'性狀與次數皆無改變');
  return env(t,0,maxg(t),'',miss);
}
function _colitis(ev){
  var t='Colitis';
  var pain=g(ev,'diarrhea','abd_pain'), blood=g(ev,'diarrhea','blood');
  var miss=['內視鏡或影像 —— Colitis 第一級在定義上是無症狀、僅有檢查發現,問卷無法排除'];
  if(pain||blood) return env(t,2,maxg(t),'G2',['歸因:免疫性腸炎或感染性腸炎'],
    ['糞便檢查含困難梭菌','考慮腸道影像或內視鏡']);
  return env(t,0,maxg(t),'',miss,[],'病人否認腹痛與血便,但這不能排除 Colitis:其第一級定義即為無症狀。');
}
function _dyspnea(ev){
  var t='Dyspnea', ex=gmap('breath','exertion',g(ev,'breath','exertion'));
  var ai=attr(ev,'adl_i','breath'), as=attr(ev,'adl_s','breath');
  var miss=['胸部影像 —— 若為治療相關肺炎,應改記 Pneumonitis 詞條而非 Dyspnea'];
  if(ex===null) return env(t,0,maxg(t),'',['病人未填此題'].concat(miss));
  if(ex===0&&!ai&&!as) return env(t,0,0,'無呼吸困難');
  var f=ex;
  if(as) f=Math.max(f,3); else if(ai) f=Math.max(f,2);
  return env(t,f,maxg(t),'G'+f,miss);
}
function _pneumonitis(ev){
  var t='Pneumonitis';
  var ex=g(ev,'breath','exertion'), cough=g(ev,'breath','cough'), nw=g(ev,'breath','new_worse');
  var miss=['胸部影像(必要) —— Pneumonitis 第一級定義為無症狀、僅有影像發現'];
  if(nw&&(((ex||0)>=1)||((cough||0)>=1)))
    return env(t,0,maxg(t),'',miss,['建議安排胸部影像','若使用 T-DXd,仿單對任何等級的間質性肺病均要求停藥'],
      '治療後新發生或加重的咳嗽/喘。分級需影像,但觸發條件已成立。');
  return env(t,0,maxg(t),'',miss,[],
    '即使病人完全無症狀,也不能排除 Pneumonitis —— 其第一級定義即為無症狀。');
}
function _rash(ev){
  var t='Rash maculo-papular', p=g(ev,'rash','present');
  if(p===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!p) return env(t,0,1,'',['視診 —— 第一級定義為無症狀,病人未必自覺']);
  var sym=gmap('rash','symptom',g(ev,'rash','symptom'));
  var bsa=g(ev,'rash','bsa');
  var miss=['視診確認型態與分布'];
  if(bsa===null) miss.push('體表面積 —— v6.0 僅第三級用到,門檻為超過 50%');
  if((bsa!==null&&bsa>50)||(sym!==null&&sym>=2)) return env(t,3,maxg(t),'G3',miss);
  if(sym===1) return env(t,2,maxg(t),'G2',miss);
  if(sym===0) return env(t,1,maxg(t),'G1',miss);
  return env(t,1,maxg(t),'G1',miss);
}
function _pruritus(ev){
  var t='Pruritus', p=g(ev,'itch','present');
  if(p===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!p) return env(t,0,0,'無搔癢');
  var spread=gmap('itch','spread',g(ev,'itch','spread'));
  var cst=gmap('itch','constant',g(ev,'itch','constant'));
  var scratch=g(ev,'itch','scratch_change'), sleep=g(ev,'itch','sleep');
  var as=attr(ev,'adl_s','itch');
  var miss=['是否需要外用、口服或全身性類固醇(臨床決定)'];
  if(sleep||as||(((spread||0)>=1)&&cst===1)) return env(t,3,3,'G3');
  if(scratch||((spread||0)>=1)||attr(ev,'adl_i','itch')) return env(t,2,maxg(t),'G2',miss);
  return env(t,1,maxg(t),'G1',miss);
}
function _anorexia(ev){
  var t='Anorexia', ap=gmap('nausea','appetite',g(ev,'nausea','appetite'));
  var wt=g(ev,'nausea','weight'), pct=_wtPct(ev), sig=(wt!==null&&wt<=-5)||(pct!==null&&pct>=10);
  var miss=['是否需口服營養補充、管灌或全靜脈營養(臨床決定)'];
  if(ap===null) return env(t,0,maxg(t),'',['病人未填此題'].concat(miss));
  if(ap===0) return env(t,0,0,'胃口無改變');
  if(ap>=2&&sig) return env(t,3,maxg(t),'G3',miss);
  if(ap>=2) return env(t,2,maxg(t),'G2',['體重變化 —— 第三級要看是否顯著體重減輕'].concat(miss));
  return env(t,1,maxg(t),'G1',miss);
}
function _neuropathy(ev){
  var t='Peripheral sensory neuropathy', s=gmap('neuro','sensory',g(ev,'neuro','sensory'));
  var fine=g(ev,'neuro','button'), as=attr(ev,'adl_s','neuro');
  if(s===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(s===0&&!fine&&!as) return env(t,0,0,'無感覺異常');
  var f=s;
  if(as) f=Math.max(f,3); else if(fine) f=Math.max(f,2);
  if(f>=3) return env(t,3,maxg(t),'G3',['是否已達危及生命(第四級,臨床判斷)']);
  return env(t,f,maxg(t),'G'+f);
}
function _sevAdl(term,item,key,ev,extraKey,extraNote){
  var v=gmap(item,key,g(ev,item,key));
  var ai=attr(ev,'adl_i',item), as=attr(ev,'adl_s',item);
  var extra=!!(extraKey&&g(ev,item,extraKey));
  if(v===null) return env(term,0,maxg(term),'',['病人未填此題']);
  if(v===0&&!ai&&!as&&!extra) return env(term,0,0,'無此症狀');
  var f=v;
  if(as) f=Math.max(f,3); else if(ai||extra) f=Math.max(f,2);
  f=Math.min(f,Math.min(3,maxg(term)));
  return env(term,f,maxg(term),'G'+f,[],[],extraNote||'');
}
function _vomiting(ev){
  var t='Vomiting', n=g(ev,'nausea','vomit'), ny=g(ev,'nausea','nausea');
  var miss=['是否需門診靜脈輸液、管灌、全靜脈營養或住院 —— 本詞條各級皆由處置定義'];
  if(n===null&&ny===null) return env(t,0,maxg(t),'',['病人未填此題'].concat(miss));
  if((n||0)>0) return env(t,1,maxg(t),'G1',miss);
  return env(t,0,0,'無嘔吐');
}
function _nausea(ev){
  var t='Nausea', ap=gmap('nausea','appetite',g(ev,'nausea','appetite'));
  var ny=g(ev,'nausea','nausea');
  var miss=['是否需靜脈輸液、管灌或住院(臨床決定)'];
  if(ap===null&&ny===null) return env(t,0,maxg(t),'',['病人未填此題'].concat(miss));
  if(!ny&&(ap||0)===0) return env(t,0,0,'無噁心且胃口未變');
  var f=Math.min(ap||0,3);
  if(ny&&f===0) f=1;
  return env(t,f,maxg(t),'G'+f,miss);
}
function _trigger(term,ev,item,keys,tests,label){
  var hit=keys.some(function(k){return g(ev,item,k)});
  var miss=[tests+'(必要) —— 此詞條的分級由檢查定義,問卷無法定級'];
  if(hit) return env(term,0,maxg(term),'',miss,['建議安排'+tests],
    '病人回報'+label+',觸發條件成立但無法定級。');
  return env(term,0,maxg(term),'',miss,[],
    '病人未回報相關症狀,但'+term+' 的低分級可為無症狀或僅檢查異常,問卷無法排除。');
}

function _wtPct(ev){
  var b=g(ev,'weight','baseline_kg'), n=g(ev,'weight','now_kg');
  if(b===null||n===null) return null; b=+b; n=+n;
  if(!(b>0)||isNaN(n)) return null;
  return (b-n)/b*100;
}

function _dysphagia(ev){
  var t='Dysphagia', present=g(ev,'swallow','present'), tube=g(ev,'swallow','tube');
  if(tube) return env(t,3,maxg(t),'G3',['是否有危及生命之後果(臨床判斷)'],[],'已用管灌進食,依定義即為第三級。');
  if(present===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!present) return env(t,0,0,'無吞嚥困難');
  var d=g(ev,'swallow','diet');
  if(d===null) return env(t,1,maxg(t),'G1',['目前吃得下什麼 —— 決定第一到第三級']);
  var lvl=gmap('swallow','diet',d);
  if(d===2) return env(t,2,3,'G2',['是否需管灌、全靜脈營養或住院 —— 「只吞得下流質」算第二或第三級待 PI 審']);
  if(lvl>=3) return env(t,3,maxg(t),'G3',['是否有危及生命之後果(臨床判斷)']);
  return env(t,lvl,lvl,'G'+lvl);
}
function _esophagitis(ev){
  var t='Esophagitis', ps=g(ev,'swallow','pain_swallow');
  var miss=['內視鏡或臨床評估 —— 第一級為無症狀,問卷無法排除;吞嚥困難也可能是腫瘤本身'];
  if(ps) return env(t,0,maxg(t),'',miss,['建議評估放射性／藥物性食道炎(臨床或內視鏡)'],'病人回報吞痛;放療或化療期間提示食道炎,但問卷分不出腫瘤本身。');
  return env(t,0,maxg(t),'',miss,[],'病人未回報吞痛,但 Esophagitis 第一級為無症狀,問卷無法排除。');
}
function _esophagealPain(ev){
  var t='Esophageal pain', present=g(ev,'swallow','present'), ps=g(ev,'swallow','pain_swallow');
  if(present===null&&ps===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!ps) return env(t,0,0,'無吞痛');
  return _sevAdl(t,'swallow','pain_sev',ev);
}
function _weightLoss(ev){
  var t='Weight loss', pct=_wtPct(ev);
  if(pct===null) return env(t,0,maxg(t),'',['治療前體重(工作人員填)與現在體重 —— 本詞條只看百分比']);
  if(pct<5) return env(t,0,0,'減少未達 5%');
  if(pct<10) return env(t,1,1,'G1');
  if(pct<20) return env(t,2,2,'G2');
  return env(t,3,3,'G3');
}
function _fnTrigger(ev){
  var t='Febrile neutropenia', temp=g(ev,'fever','temp'), present=g(ev,'fever','present');
  var miss=['嗜中性球數值(ANC) —— 本詞條由抽血定義,問卷無法定級'];
  if(temp!==null&&temp>=38.0) return env(t,0,maxg(t),'',miss,['建議安排全血球計數(白血球／嗜中性球)'],'發燒 38 度以上,化療期間需排除發燒性嗜中性球低下。');
  if(temp===null&&present===null) return env(t,0,maxg(t),'',['病人未填此題'].concat(miss));
  return env(t,0,maxg(t),'',miss,[],'病人未回報 38 度以上發燒;本詞條起於第三級且需 ANC,問卷無法排除。');
}
function _pain(ev){
  var t='Pain', present=g(ev,'pain','present');
  if(present===null) return env(t,0,maxg(t),'',['病人未填此題']);
  if(!present) return env(t,0,0,'無疼痛');
  return _sevAdl(t,'pain','sev',ev);
}
function _dermRt(ev){
  var t='Dermatitis radiation', v=g(ev,'skin_rt','look');
  if(v===null) return env(t,0,maxg(t),'',['病人未填此題']);

  if(lvl<3) return env(t,lvl,lvl,'G'+lvl);
  return env(t,3,maxg(t),'G3',['是否全層潰瘍、皮膚壞死或自發性出血(臨床) —— 第四級']);
}
function _hoarseness(ev){
  var t='Hoarseness', v=g(ev,'voice','level');
  if(v===null) return env(t,0,maxg(t),'',['病人未填此題']);
  var lvl=gmap('voice','level',v);
  if(lvl===0) return env(t,0,0,'無聲音沙啞');

};

function evaluate(ev){
  var out={};
  for(var t in RULES) out[t]=RULES[t](ev);
  return out;
}
function summary(ev){
  var res=evaluate(ev);
  var out={determinable:[],floor_only:[],cannot_grade:[],triggers:[]};
  for(var t in res){
    var e=res[t];
    if(e.floor===0&&e.ceiling===0) continue;
    var rec={term:t,floor:e.floor,ceiling:e.ceiling,basis_text:e.basis_text,
             missing:e.missing,note:e.note,soc:e.soc,actionable:e.actionable};
    if(e.determinable) out.determinable.push(rec);
    else if(e.floor>0) out.floor_only.push(rec);
    else out.cannot_grade.push(rec);
    e.triggers.forEach(function(x){ if(out.triggers.indexOf(x)<0) out.triggers.push(x) });
  }
  ['determinable','floor_only','cannot_grade'].forEach(function(k){
    out[k].sort(function(a,b){return b.floor-a.floor});
  });
  return out;
}
var GRADE_ACTION_THRESHOLD=2;
function triage(s,flags,deltas,hasText){
  var why=[],n=0;
  ['determinable','floor_only'].forEach(function(k){
    (s[k]||[]).forEach(function(x){ if(x.floor>=GRADE_ACTION_THRESHOLD) n++ });

   2026-09-19 實測:直接送 UTF-8 時 79 位元組被解成 55 位元組,中文全變亂碼,
   而畫面上一切看起來正常 —— QR 出得來、掃得到、資料也吐出來,只是內容是錯的。
   改成 base64url 之後全鏈只有 ASCII,任何掃描器與解碼器的結果都一致。
   代價是體積多 33%,值得。

  L.push("【門診 ePRO 症狀紀錄】");L.push("研究編號 "+b.pid+"　填寫 "+tsText(b.filledAt)+"（"+(b.filledBy==="family"?"家屬代填":"本人填")+"，"+(DC[b.drugClass]||"")+"）");
  L.push("分級依據 CTCAE v"+b.ctcaeV+"　題庫 v"+b.panelV);L.push("");

    var plan=l3?l3.plan:(planNow||"");if(String(plan).trim())L.push("處置　"+String(plan).trim());}else L.push("確認等級　（尚未確認）");

/* ---------- 金鑰 ---------- */
function openKey(){return x().col("meta").doc("promkey").get().then(function(d){
  if(!d.exists){if(!x().isAdmin())throw new Error("ePRO 還沒啟用，請找主持人");return createKey();}
  var o=d.data(),w=o.keys&&o.keys[meUid()];if(!w)throw new Error("您的帳號還沒開通看 ePRO 的權限，請找主持人到「帳號管理」開通");
  return x().rsaUnwrap(w).then(function(raw){return x().aesKey(raw).then(function(k){PK={raw:raw,key:k,ver:o.ver||1,keys:o.keys,kfp:o.kfp||{}};return PK;});});});}
function createKey(){var raw=x().rnd(32),pub=x().profile().pub;return Promise.all([x().aesKey(raw),x().rsaWrap(pub,raw),x().fpOf(pub)]).then(function(r){var keys={},kfp={};keys[meUid()]=r[1];kfp[meUid()]=r[2];
  return x().col("meta").doc("promkey").set({keys:keys,kfp:kfp,ver:1,createdAt:x().TS()}).then(function(){PK={raw:raw,key:r[0],ver:1,keys:keys,kfp:kfp};SEC.secLog("建立 ePRO 金鑰");return writeRecipients();}).then(function(){return PK;});});}
/* 收件人名冊 meta/recipients{pubs{uid:pub}}：ePRO 金鑰持有者的公開金鑰，工作人員發權杖時讀。只有主持人能寫，跟著 grant/revoke 一起更新。 */
function writeRecipients(){if(!x().isAdmin()||!PK)return Promise.resolve();var U=x().users(),pubs={};Object.keys(PK.keys).forEach(function(uid){var pub=uid===meUid()?x().profile().pub:(U[uid]||{}).pub;if(pub)pubs[uid]=pub;});
  return x().col("meta").doc("recipients").set({pubs:pubs,ver:PK.ver,updatedAt:x().TS()});}
function grant(uid){if(!x().isAdmin())return Promise.reject(new Error("只有主持人可以授權 ePRO 金鑰"));
  return (PK?Promise.resolve(PK):openKey()).then(function(){var u=x().users()[uid];if(!u||!u.pub)throw new Error("找不到這個帳號的公鑰");
    return Promise.all([x().rsaWrap(u.pub,PK.raw),x().fpOf(u.pub)]).then(function(r){var keys=Object.assign({},PK.keys),kfp=Object.assign({},PK.kfp);keys[uid]=r[0];kfp[uid]=r[1];
      return x().col("meta").doc("promkey").update({keys:keys,kfp:kfp,ver:(PK.ver||1)+1,updatedAt:x().TS()}).then(function(){PK.keys=keys;PK.kfp=kfp;PK.ver=(PK.ver||1)+1;SEC.secLog("授權 ePRO 金鑰給 "+(u.email||uid));return writeRecipients();});});});}
function revoke(uid){if(!x().isAdmin())return Promise.reject(new Error("只有主持人可以收回"));return (PK?Promise.resolve(PK):openKey()).then(function(){
  var keys=Object.assign({},PK.keys),kfp=Object.assign({},PK.kfp);delete keys[uid];delete kfp[uid];
  return x().col("meta").doc("promkey").update({keys:keys,kfp:kfp,ver:(PK.ver||1)+1,updatedAt:x().TS()}).then(function(){PK.keys=keys;PK.kfp=kfp;PK.ver=(PK.ver||1)+1;SEC.secLog("收回 ePRO 金鑰 "+uid);return writeRecipients();});});}
/* 離開研究／改角色後，收回「已不是個管師/醫師、也不是主持人」的人的 ePRO 金鑰與收件人名冊（2026-10-01：先前 PROM.revoke 全站無人呼叫）。
   純函式 staleKeyUids 可在 node 測；members/users 沒載入（空）時一律不動，免得誤收回所有人。保留：自己、主持人帳號、(帳號 user 且成員角色 nurse/doctor)。 */
function staleKeyUids(keys,M,U,me){var ks=Object.keys(keys||{});if(!ks.length||!Object.keys(M||{}).length||!Object.keys(U||{}).length)return [];
  return ks.filter(function(uid){if(uid===me)return false;var u=U[uid],m=M[uid];if(u&&u.role==="admin")return false;return !(u&&u.role==="user"&&m&&(m.role==="nurse"||m.role==="doctor"));});}
function revokeStale(){if(!x().isAdmin()||!PK)return Promise.resolve(0);
  var gone=staleKeyUids(PK.keys,x().members(),x().users(),meUid());if(!gone.length)return Promise.resolve(0);
  var keys=Object.assign({},PK.keys),kfp=Object.assign({},PK.kfp);gone.forEach(function(uid){delete keys[uid];delete kfp[uid];});
  return x().col("meta").doc("promkey").update({keys:keys,kfp:kfp,ver:(PK.ver||1)+1,updatedAt:x().TS()}).then(function(){PK.keys=keys;PK.kfp=kfp;PK.ver=(PK.ver||1)+1;SEC.secLog("收回 ePRO 金鑰（已非個管師／醫師）"+gone.length+" 人");return writeRecipients();}).then(function(){return gone.length;});}
/* 個管師/醫師重建金鑰後，主持人載入時自動重新授權(對齊病歷摘錄的 staleRegrant) */
function regrantStale(){if(!x().isAdmin()||!PK)return Promise.resolve(0);var U=x().users(),M=x().members(),jobs=[];
  Object.keys(M).forEach(function(uid){var m=M[uid];if(!(m.role==="nurse"||m.role==="doctor"))return;var u=U[uid];if(!u||!u.pub||u.role!=="user")return;
    jobs.push(x().fpOf(u.pub).then(function(fp){if(PK.kfp[uid]!==fp||!PK.keys[uid])return grant(uid).then(function(){return 1;});return 0;}));});
  return Promise.all(jobs).then(function(a){return a.reduce(function(s,v){return s+v;},0);});}

/* ---------- 密文與讀寫 ---------- */
function seal(b){return x().aesEnc(PK.key,enc.encode(JSON.stringify(b)));}
function openCt(m){return x().aesDec(PK.key,{iv:m.iv,ct:m.ct}).then(function(u){return JSON.parse(dec.decode(u));});}
function sortOrder(){ORDER=Object.keys(RECS).sort(function(a,b){return (RECS[b].body.filledAt||0)-(RECS[a].body.filledAt||0);});}
function prevBody(pid,before,exceptId){var best=null;ORDER.forEach(function(id){var r=RECS[id];if(id===exceptId||r.body.pid!==pid)return;if((r.body.filledAt||0)>=before)return;
  if(!best||(r.body.filledAt||0)>(best.filledAt||0))best=r.body;});return best;}
function loadAll(progress){RECS={};ORDER=[];LOADED=false;return openKey().then(function(){return x().col("prom").get();}).then(function(qs){var docs=qs.docs,miss=0,done=0;
  return Promise.all(docs.map(function(d){var m=d.data();return openCt(m).then(function(b){RECS[d.id]={id:d.id,meta:m,body:b};},function(){miss++;}).then(function(){done++;if(progress)progress(done,docs.length);});}))
    .then(function(){sortOrder();LOADED=true;return {n:ORDER.length,miss:miss,fromCache:!!(qs.metadata&&qs.metadata.fromCache)};});})
  /* 送達了但沒人看＝本計畫要解的失效。所以載入時自動收件（冪等），按鈕留作重試；主持人另外清 30 天前已收件的收件匣 */
  .then(function(r){if(S()&&S().offline)return r;return consumeInbox().then(function(c){LASTC=c;if(c.n)NOTES.push("讀進 "+c.n+" 份病人手機送來的紀錄");if(c.errors.length)NOTES.push(c.errors.length+" 份病人送來的沒讀進來，請按「重新讀取」；還不行請找主持人");r.consumed=c.n;return x().isAdmin()?purgeInbox().then(function(p){r.purged=p.purged;if(p.stale)NOTES.push("⚠ 有 "+p.stale+" 份病人送來的超過 "+INBOX_WARN_DAYS+" 天還沒讀進來，請找主持人檢查");return r;}):r;},function(e){NOTES.push("病人送來的紀錄讀取失敗："+(e&&e.message||e));return r;});});}
function lastConsume(){return LASTC;}
/* 收件匣清理：只刪「已收件且超過 30 天」；未收件的不論多舊都不刪，只警告 */
function purgeInbox(){if(!x().isAdmin())return Promise.resolve({purged:0,stale:0});var now=Date.now(),purged=0,stale=0;
  return x().col("prom_inbox").get().then(function(qs){var jobs=[];qs.forEach(function(d){var v=d.data(),at=v.consumedAt&&v.consumedAt.toMillis?v.consumedAt.toMillis():0,cr=v.at&&v.at.toMillis?v.at.toMillis():0;
    if(v.consumed&&at&&now-at>INBOX_KEEP_DAYS*86400e3){jobs.push(x().col("prom_inbox").doc(d.id).delete().then(function(){purged++;}));}
    else if(!v.consumed&&cr&&now-cr>INBOX_WARN_DAYS*86400e3)stale++;});
    return Promise.all(jobs).then(function(){if(purged)SEC.secLog("清理已收件 "+INBOX_KEEP_DAYS+" 天以上的收件匣 "+purged+" 筆");return {purged:purged,stale:stale};});});}
/* 離線備份檢視：用主持人私鑰解 promkey，再解每筆 PROM（唯讀） */
function loadFromBackup(B){RECS={};ORDER=[];LOADED=false;var pk=B.meta&&B.meta.promkey,uid=S().uid;if(!pk||!pk.keys||!pk.keys[uid])return Promise.resolve(0);
  return x().rsaUnwrap(pk.keys[uid]).then(function(raw){return x().aesKey(raw).then(function(k){PK={raw:raw,key:k,ver:pk.ver||1,keys:pk.keys,kfp:pk.kfp||{}};});}).then(function(){var ids=Object.keys(B.prom||{});
    return Promise.all(ids.map(function(id){var mm=B.prom[id];return openCt(mm).then(function(b){RECS[id]={id:id,meta:mm,body:b};},function(){});}));}).then(function(){sortOrder();LOADED=true;return ORDER.length;});}
/* 權杖連結的 QR（Kazuhiko Arase qrcode.js，已隨建置內嵌）；桌上螢幕給病人手機掃，字要大 */

function create(b,source){var id=b.pid+"_"+b.visit;if(!b.pid)return Promise.reject(new Error("缺研究編號"));if(RECS[id])return Promise.reject(new Error("這筆已存在："+id));

  return seal(b).then(function(o){var T=x().TS(),data={pid:b.pid,visit:b.visit,filledAt:b.filledAt,source:source||"staff",triage:en.triage.level,closed:false,panelV:b.panelV,ctcaeV:b.ctcaeV,
      iv:o.iv,ct:o.ct,ver:1,createdAt:T,createdBy:meUid(),updatedAt:T,updatedBy:meUid()};
    return x().col("prom").doc(id).set(data).then(function(){RECS[id]={id:id,meta:Object.assign({},data),body:b};sortOrder();return id;});});}

  var ref=x().col("prom").doc(r.id);return ref.update(data).then(function(){Object.assign(r.meta,data,{ver:ver});return ref.collection("log").add({uid:meUid(),at:x().TS(),ver:ver}).catch(function(){});});});}
function review(id,f){var r=RECS[id];if(!r)return Promise.reject(new Error("找不到紀錄"));if(!canReview())return Promise.reject(new Error("只有個管師或主持人可以初審"));
  var old=r.body,b=JSON.parse(JSON.stringify(old));applyReview(b,{by:meUid(),name:meName(),at:Date.now(),note:f.note,contacted:f.contacted,urgency:f.urgency,signal:f.signal,terms:f.terms,suggest:f.suggest,confirms:f.confirms});

  /* 草稿在送出當下就切離（confirms 已複製進這一筆）：存檔期間繼續做的修改屬於下一筆，不能被存檔完成的回呼清掉；存失敗就把草稿還回去（2026-10-04 UI 壓力測試抓到的競態） */

function confirm(id,grades,plan){var r=RECS[id];if(!r)return Promise.reject(new Error("找不到紀錄"));if(!canConfirm())return Promise.reject(new Error("只有醫師或主持人可以確認"));
  if(!Object.keys(grades||{}).length)return Promise.reject(new Error("請至少選一個等級（系統不會自動帶入）"));
  var old=r.body,b=JSON.parse(JSON.stringify(old));applyConfirm(b,{by:meUid(),name:meName(),at:Date.now(),grades:grades,plan:plan});r.body=b;
  return save(r,{closed:true,closedAt:x().TS(),closedBy:meUid()}).then(function(){SEC.secLog("ePRO 確認結案 "+id);},function(e){r.body=old;throw e;});}

/* ---------- 門診代號（P10，2026-10-03）：病人不一定有研究編號 ----------
   留白＝系統自動產生「P＋日期＋隨機碼」（例 P261003-K7QH）；字母表去掉易混的 0/O/1/I，32 字元（256 能整除，隨機位元組取餘數是均勻的）。
   代號是假名，不含任何身分；對照（這張卡發給誰）請護理師自己記，雲端不存。 */
var CODE_ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",PID_RE=/^[A-Za-z]{1,6}\d{3,8}(-[A-Za-z0-9]{2,6})?$/;
function pidOk(pid){return PID_RE.test(String(pid||"").trim());}
function autoCode(d,rnd){d=d||new Date();var u=(rnd||function(n){return x().rnd(n);})(4),t="";for(var i=0;i<4;i++)t+=CODE_ALPHA.charAt(u[i]%CODE_ALPHA.length);
  return "P"+String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate())+"-"+t;}
function genPid(seen,d,rnd){seen=seen||{};for(var i=0;i<12;i++){var c=autoCode(d,rnd);if(!seen[c])return c;}throw new Error("代號連續重複，已達重試上限（12 次）。請重新操作；若仍發生，請通知系統維護者。");}
/* ---------- 依病歷推測治療別（發權杖用；P12，2026-10-04） ----------
   原則：寧可多勾不要少勾（漏問加掛安全題的風險大於多問一屏）。不確定的一律交人工，並寫出依據。
   化療＝本線含藥物 1–7、9、10（Leucovorin 單獨不算）；免疫＝12 或 13；放療＝rt_course 進行中或剛結束。 */
var TX_CHEMO={1:1,2:1,3:1,4:1,5:1,6:1,7:1,9:1,10:1},TX_IO={12:1,13:1},
  DRUG_NAME={1:"Cisplatin",2:"Carboplatin",3:"Oxaliplatin",4:"5-FU",5:"Capecitabine",6:"UFT",7:"TS-1",8:"Leucovorin",9:"Paclitaxel",10:"Docetaxel",11:"Cetuximab",12:"Nivolumab",13:"Pembrolizumab",88:"其他"},
  TX_GRACE_DAYS=42,RT_GRACE_DAYS=84,TX_STALE_DAYS=90;   /* 停藥後仍算進行中 42 天（一個週期＋寬限）；放療結束後 84 天（恢復期，PI 可調）；病歷超過 90 天沒更新就提醒 */
function ymdMs(v){var m=/^\s*(\d{4})[-\/]?(\d{1,2})[-\/]?(\d{1,2})\s*$/.exec(String(v==null?"":v));if(!m)return null;var t=Date.UTC(+m[1],+m[2]-1,+m[3]);return isNaN(t)||+m[2]<1||+m[2]>12||+m[3]<1||+m[3]>31?null:t;}
function ymdText(ms){var d=new Date(ms);return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate());}
function inferTx(rec,now){now=now==null?Date.now():now;var out={tx:[],why:{},notes:[],warn:[],known:!!rec,manual:false},DAY=864e5;
  if(!rec){out.warn.push("查無此編號的病歷，請手動選擇");out.manual=true;return out;}
  var ca=rec.core_abstraction||{},lines=Array.isArray(rec.systemic_line)?rec.systemic_line:[],rts=Array.isArray(rec.rt_course)?rec.rt_course:[],use={};
  var asof=ymdMs(ca.sys_tx_asof);if(asof!=null&&now-asof>TX_STALE_DAYS*DAY)out.warn.push("病歷資料截至 "+ymdText(asof)+"，已超過 "+TX_STALE_DAYS+" 天，請人工確認");
  if(String(ca.sys_tx_status)==="3")out.notes.push("病歷標記：確認無抗癌藥物治療（至資料截至日）");
  else lines.forEach(function(L,i){if(!L)return;var drugs=(Array.isArray(L.line_drugs)?L.line_drugs:String(L.line_drugs||"").split(/[,\s]+/)).map(String).filter(Boolean),
      st=ymdMs(L.line_start),en=ymdMs(L.line_end),label="第 "+(L.line_no!==undefined&&L.line_no!==""?L.line_no:i+1)+" 線 "+drugs.map(function(k){return DRUG_NAME[k]||k;}).join("＋");
    if(st==null){out.warn.push(label+"：開始日不明，請人工確認");return;}
    var active=st<=now&&(en==null||now-en<=TX_GRACE_DAYS*DAY);if(!active)return;
    var state=en==null?"進行中":"停藥 "+Math.max(0,Math.round((now-en)/DAY))+" 天內",txt=label+"（"+ymdText(st)+" 開始，"+state+"）";
    if(drugs.some(function(k){return TX_CHEMO[k];})){use.chemo=(use.chemo||[]).concat([txt]);}
    if(drugs.some(function(k){return TX_IO[k];})){use.io=(use.io||[]).concat([txt]);}
    if(drugs.indexOf("11")>=0)out.notes.push(label+"：Cetuximab 目前題庫沒有專屬加掛題");
    if(drugs.indexOf("88")>=0)out.warn.push(label+"：含「其他」抗癌藥，請人工確認是否需要加掛題");});
  rts.forEach(function(R,i){if(!R)return;var st=ymdMs(R.rt_start),en=ymdMs(R.rt_end);if(st==null){out.warn.push("第 "+(i+1)+" 次放療：開始日不明，請人工確認");return;}
    if(st>now)return;if(en!=null&&now-en>RT_GRACE_DAYS*DAY)return;
    var state=en==null?"進行中（結束日未填）":"結束 "+Math.max(0,Math.round((now-en)/DAY))+" 天內，仍在恢復期";
    use.rt=(use.rt||[]).concat(["放療（"+ymdText(st)+" 開始，"+state+"）"]);});
  ["chemo","io","rt"].forEach(function(k){if(use[k]){out.tx.push(k);out.why[k]=use[k].join("；");}});
  if(!out.tx.length&&!out.notes.length&&!out.warn.length&&!lines.length&&!rts.length){out.warn.push("病歷中無治療線或放療資料，請手動選擇");}
  out.manual=!out.tx.length||out.warn.length>0;return out;}
/* ---------- 權杖（工作人員發給病人）與收件匣（P3） ---------- */
function sha256b64(str){return crypto.subtle.digest("SHA-256",enc.encode(str)).then(function(h){var u=new Uint8Array(h),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);});}
function b64rand(n){var u=x().rnd(n),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/[+/=]/g,"").slice(0,n);}
function recipients(){return x().col("meta").doc("recipients").get().then(function(d){var p=d.exists&&d.data().pubs||{};if(!Object.keys(p).length)throw new Error("收件人名冊為空：請主持人先開啟一次 ePRO 頁面（以建立金鑰）");return p;});}
