<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>醫師回診前確認原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：左邊是個管師初審完的病人（需要醫師處理的在最前），右邊是一位病人：先看哪些要醫師處理，再看個管師已確認了什麼，最後按「醫師確認」（第三層）。 */
:root{--bg:#EEF2F1;--panel:#FFFFFF;--ink:#16231F;--soft:#4B5C56;--rule:#D0D9D5;--well:#E4EBE8;--acc:#1B6757;--acc-ink:#FFFFFF;--acc-soft:#D7EAE3;--today:#B3261E;--today-soft:#FCE8E5;--act:#8A5A00;--act-soft:#FFF0CF;--read:#1F5E94;--read-soft:#DDEBF8;--ok:#2C6B3F;--ok-soft:#DDF0E1;--focus:#2F6FA3;--sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","PingFang TC",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1614;--panel:#18211F;--ink:#E4ECE9;--soft:#A3B3AC;--rule:#30403A;--well:#202C29;--acc:#6CC3AC;--acc-ink:#0D1714;--acc-soft:#1C3731;--today:#F2877C;--today-soft:#3A1F1C;--act:#F0C674;--act-soft:#3A2F14;--read:#8DBEEA;--read-soft:#1B2B3B;--ok:#8FD3A1;--ok-soft:#1C3324;--focus:#7FB4E0;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0F1614;--panel:#18211F;--ink:#E4ECE9;--soft:#A3B3AC;--rule:#30403A;--well:#202C29;--acc:#6CC3AC;--acc-ink:#0D1714;--acc-soft:#1C3731;--today:#F2877C;--today-soft:#3A1F1C;--act:#F0C674;--act-soft:#3A2F14;--read:#8DBEEA;--read-soft:#1B2B3B;--ok:#8FD3A1;--ok-soft:#1C3324;--focus:#7FB4E0;color-scheme:dark;}
html{font-size:16px;} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;padding-inline:16px;padding-block:0 32px;} *{box-sizing:border-box;} :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px;}
.proto{margin:0 -16px;padding:6px 16px;background:var(--well);color:var(--soft);font-size:.82rem;text-align:center;}
.wrap{max-width:1100px;margin:0 auto;} header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-block:12px 8px;} h1{margin:0;font-size:1.25rem;} .sl{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem;color:var(--soft);} .sl b{color:var(--ink);font-family:var(--mono);} .sl b.t{color:var(--today);}
.cols{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:14px;align-items:start;} @media (max-width:760px){.cols{grid-template-columns:1fr;}}
.q{display:grid;gap:8px;margin:0;padding:0;list-style:none;} .qi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:2px solid var(--rule);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;} .qi[aria-current=true]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);} .qi .code{font-family:var(--mono);font-size:.92rem;font-weight:500;} .qi small{display:block;color:var(--soft);font-size:.84rem;}
.chip{display:inline-block;min-width:3.4em;text-align:center;padding:2px 8px;border-radius:6px;font-size:.82rem;font-weight:700;white-space:nowrap;} .c-today{background:var(--today-soft);color:var(--today);} .c-act{background:var(--act-soft);color:var(--act);} .c-read{background:var(--read-soft);color:var(--read);} .c-ok{background:var(--ok-soft);color:var(--ok);} .c-skip{background:var(--well);color:var(--soft);}
.pane{display:grid;gap:12px;} .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;} .card h2{margin:0 0 6px;font-size:1.02rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;} .card h2 small{font-weight:400;color:var(--soft);font-size:.85rem;} .card.today{border-color:var(--today);} .card.today h2{color:var(--today);}
.head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;} .head .code{font-family:var(--mono);font-size:1.15rem;font-weight:500;} .head span{color:var(--soft);font-size:.92rem;}
ul.fl{margin:0;padding:0;list-style:none;display:grid;gap:8px;} .fi{padding:8px 10px;border-radius:10px;background:var(--today-soft);} .fi.act{background:var(--act-soft);} .fi.read{background:var(--read-soft);} .fi b{font-size:.98rem;} .fi small{display:block;color:var(--soft);font-size:.86rem;}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);font:inherit;font-size:.98rem;font-weight:700;cursor:pointer;} .btn[disabled]{opacity:.55;cursor:default;}
.imp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;} .imp input{flex:1 1 280px;min-width:0;min-height:40px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;} .kv dt{color:var(--soft);font-size:.9rem;} .kv dd{margin:0;font-family:var(--mono);font-size:.92rem;} .mini{color:var(--soft);font-size:.88rem;margin:4px 0 0;}
</style>
<div class="proto">原型：病人與資料都是虛構的，不會連到正式系統</div>
<div class="wrap"><header><h1>醫師回診前確認</h1><div class="sl" id="sl" aria-live="polite"></div></header>
<div class="imp"><input id="imp" type="text" placeholder="貼上個管師給的連結，按匯入" aria-label="匯入"><button class="btn" id="impgo" type="button" style="min-height:40px">匯入</button><span id="impmsg" class="mini" aria-live="polite"></span></div><div class="cols"><nav aria-label="待確認的病人"><ul class="q" id="queue"></ul></nav><main class="pane" id="pane"></main></div></div>
<script>
/* ---- 連結交接（不需伺服器）：資料包 gzip 後放在網址的 #d= 後面；沒有 CompressionStream 時用未壓縮 ---- */
const b64u = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = t => { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; const s = atob(t), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function pack(obj) { const j = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) { try { const cs = new CompressionStream("gzip"), w = cs.writable.getWriter(); w.write(j); w.close(); return "z." + b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer())); } catch (e) {} }
  return "j." + b64u(j); }
async function unpack(s) { s = String(s).trim(); const m = s.match(/#d=([A-Za-z0-9_.\-]+)/); if (m) s = m[1]; else if (s[0] === "{") return JSON.parse(s);
  const u = unb64u(s.slice(2)); if (s[0] === "z") { const ds = new DecompressionStream("gzip"), w = ds.writable.getWriter(); w.write(u); w.close(); return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())); }
  return JSON.parse(new TextDecoder().decode(u)); }
const linkTo = async (page, obj) => new URL(page, location.href).origin + new URL(page, location.href).pathname + "#d=" + await pack(obj);
const copyText = (t, btn) => { const ok = () => { if (btn) btn.textContent = "已複製"; }, fb = () => { const ta = document.querySelector("#lk, #dl"); if (ta) { ta.focus(); ta.select(); } if (btn) btn.textContent = "已選取，請手動複製"; };
  try { navigator.clipboard.writeText(t).then(ok, fb); } catch (e) { fb(); } };

const NAME = {fever:"發燒",swallow:"吞嚥困難",breath:"喘或咳嗽",weight:"體重掉很多",blood:"血便或黏液便",hemo:"咳血或吐血",weak:"肌肉沒力",chest:"胸悶或胸痛",palp:"心跳很快或不規則",dizzy:"站起來頭暈、眼前發黑",eyepain:"眼睛痛、很紅或怕光",fatigue:"疲倦、沒力氣",nausea:"噁心、吃不下",diarrhea:"拉肚子",pain:"疼痛",joint:"關節或肌肉痛"};
const TXN = {chemo:"化療",rt:"放療",io:"免疫治療",adc:"ADC"}, txs = a => (a || []).map(t => TXN[t] || t).join("＋");
const R = [];   // 收到的紀錄（個管師初審完）
let CUR = 0, DUPES = 0; const L3 = {};
const E = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = q => document.querySelector(q);
const urgent = r => r.flags.filter(f => f.level === "today" && (f.resp === "通知醫師" || /^unconf_/.test(f.id) || !f.resp));
const routine = r => r.flags.filter(f => f.level === "today" && !urgent(r).includes(f));
const rank = r => L3[r.code] ? 9 : urgent(r).length ? 0 : routine(r).length ? 1 : 2;
function render() {
  const open = R.filter(r => !L3[r.code]), nU = open.filter(r => urgent(r).length).length;
  $("#sl").innerHTML = `<span><b class="t">${nU}</b> 位需要您先處理</span><span>待確認 <b>${open.length}</b></span><span>已確認 <b>${R.length - open.length}</b></span>`;
  if (!R.length) { $("#queue").innerHTML = ""; $("#pane").innerHTML = '<p class="mini">等待個管師送來的紀錄…</p>'; return; }
  const order = R.map((r, i) => i).sort((a, b) => rank(R[a]) - rank(R[b]) || a - b); if (CUR >= R.length) CUR = 0;
  $("#queue").innerHTML = order.map(i => { const r = R[i], u = urgent(r).length, k = rank(r);
    return `<li><button type="button" class="qi" data-i="${i}" aria-current="${i === CUR}"><span class="chip c-${L3[r.code] ? "ok" : u ? "today" : k === 1 ? "act" : "skip"}">${L3[r.code] ? "已確認" : u ? "請先處理" : k === 1 ? "看診時處理" : "無需處理"}</span><span><span class="code">${E(r.code)}</span><small>${E(r.age)}　${txs(r.tx)}</small></span></button></li>`; }).join("");
  const r = R[CUR], U = urgent(r), T = routine(r), O = r.flags.filter(f => f.level !== "today"), un = r.flags.filter(f => /^unconf_/.test(f.id));
  const li = (f, cls = "") => `<li class="fi ${cls}"><b>${E(f.text)}</b><small>依據：${E(f.why)}${f.resp ? `　個管師回覆：${E(f.resp)}` : ""}</small></li>`;
  let h = `<section class="card"><div class="head"><span class="code">${E(r.code)}</span><span>${E(r.age)}</span><span>${txs(r.tx)}</span><span class="chip c-${L3[r.code] ? "ok" : U.length ? "today" : "act"}">${L3[r.code] ? "已確認" : U.length ? "請先處理" : "看診時處理"}</span></div></section>`;
  h += U.length ? `<section class="card today"><h2>請您先處理 <small>${U.length} 項：個管師通知，或沒能聯絡到病人</small></h2><ul class="fl">${U.map(f => li(f)).join("")}</ul></section>` : `<section class="card"><h2>請您先處理 <small>沒有</small></h2></section>`;
  if (T.length) h += `<section class="card"><h2>看診時處理 <small>${T.length} 項</small></h2><ul class="fl">${T.map(f => li(f)).join("")}</ul></section>`;
  if (O.length) h += `<section class="card"><h2>其他</h2><ul class="fl">${O.map(f => li(f, f.level)).join("")}</ul></section>`;
  const cf = r.conf.filter(c => c.res !== "escalate" && c.res !== "nc");
  h += `<section class="card"><h2>個管師已確認 <small>${cf.length} 項</small></h2>${cf.length ? `<ul class="fl">${cf.map(c => `<li class="fi read"><b>${E(NAME[c.id] || c.id)}</b><small>${c.res === "y" ? "電話確認：有" : c.res === "n" ? "電話確認：沒有" : c.res === "measured" ? `實測 ${E(c.note)}` : E(c.res)}${c.res !== "measured" && c.note ? `（${E(c.note)}）` : ""}</small></li>`).join("")}</ul>` : '<p class="mini">沒有需要確認的項目。</p>'}<dl class="kv" style="margin-top:8px"><dt>實測體重</dt><dd>${r.staff.weight ?? "—"}${r.staff.base_kg ? `（治療前 ${r.staff.base_kg} kg）` : ""}</dd><dt>院內體溫</dt><dd>${r.staff.temp ?? "—"}</dd></dl></section>`;
  if (r.note) h += `<section class="card"><h2>病人的話</h2><p style="margin:0">${E(r.note)}</p></section>`;
  h += `<section class="card"><h2>第三層　醫師確認</h2><button class="btn" id="l3" type="button" ${L3[r.code] ? "disabled" : ""}>${L3[r.code] ? "已確認" : "醫師確認"}</button>${un.length && !L3[r.code] ? `<p class="mini">有 ${un.length} 項沒能聯絡到病人確認，看診時請當面問。</p>` : ""}</section>`;
  $("#pane").innerHTML = h;
}
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.i != null) { CUR = +b.dataset.i; return render(); }
  if (b.id === "l3") { const r = R[CUR]; L3[r.code] = Date.now(); try { parent.postMessage({ type: "l3done", code: r.code, urgent: urgent(r).map(f => f.id), routine: routine(r).map(f => f.id) }, "*"); } catch (x) {} render(); } });
function receive(rec) { const dup = R.findIndex(x => x.code === rec.code) >= 0; if (dup) DUPES++; else R.push(rec); return dup; }   // 用 code 去重
window.addEventListener("message", ev => { const m = ev.data; if (!m || m.type !== "l2done") return;
  const rec = m.record, dup = receive(rec);
  try { ev.source.postMessage({ type: "received", code: rec.code, dup }, "*"); } catch (x) {} render(); });
async function importFrom(text) { const rec = await unpack(text); if (!rec || !rec.flags) throw new Error("不是個管師端的紀錄"); const dup = receive(rec); CUR = R.findIndex(x => x.code === rec.code); render(); return { code: rec.code, dup }; }
async function importBox() { const msg = $("#impmsg"), inp = $("#imp"); try { const r = await importFrom(inp.value); msg.textContent = r.dup ? `${r.code} 已經匯入過了` : `已匯入 ${r.code}`; inp.value = ""; } catch (e) { msg.textContent = "匯入失敗：" + String(e.message || e).slice(0, 80); } }
document.addEventListener("click", e => { if (e.target.id === "impgo") importBox(); });
(async () => { if (/^#d=/.test(location.hash)) { try { await importFrom(location.hash); history.replaceState(null, "", location.pathname + location.search); } catch (e) { const m = $("#impmsg"); if (m) m.textContent = "連結無法讀取：" + String(e.message || e).slice(0, 80); } } })();
window.__state = () => ({ records: R.map(r => ({ code: r.code, urgent: urgent(r).map(f => f.id), routine: routine(r).map(f => f.id), flags: r.flags.map(f => ({ id: f.id, level: f.level, resp: f.resp })), l3: !!L3[r.code] })), dupes: DUPES });
render();
</script>
