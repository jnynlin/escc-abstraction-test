<style>
/* 版面：手機單欄（最寬 520px），上方固定進度、下方固定「上一步／下一步」放在大拇指區。每屏只做一種決定：重要 4 題 → 症狀清單 2 屏（逐列有／沒有，答「有」才在該列展開嚴重度）→ 想說的話 → 確認。 */
:root{
  --bg:#F2F5F3; --panel:#FFFFFF; --ink:#18241F; --soft:#4F5F59; --rule:#D3DBD7; --well:#E7EDEA;
  --acc:#1D6A5A; --acc-ink:#FFFFFF; --acc-soft:#D9EBE5;
  --no:#34413C; --no-ink:#FFFFFF;
  --red:#B3261E; --red-soft:#FCE9E6; --warn:#7A4B00; --warn-soft:#FFF1D6; --focus:#2F6FA3;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --panel:#18211E; --ink:#E6EEEA; --soft:#A5B5AE; --rule:#32413B; --well:#202B27;
  --acc:#6CC3AC; --acc-ink:#0D1714; --acc-soft:#1D3730; --no:#C9D4CF; --no-ink:#101715;
  --red:#F2877C; --red-soft:#3A1F1C; --warn:#F0C674; --warn-soft:#3A2F14; --focus:#7FB4E0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101715; --panel:#18211E; --ink:#E6EEEA; --soft:#A5B5AE; --rule:#32413B; --well:#202B27;
  --acc:#6CC3AC; --acc-ink:#0D1714; --acc-soft:#1D3730; --no:#C9D4CF; --no-ink:#101715;
  --red:#F2877C; --red-soft:#3A1F1C; --warn:#F0C674; --warn-soft:#3A2F14; --focus:#7FB4E0; color-scheme:dark;}
html{font-size:18px;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-inline:16px;padding-block:0 128px;}
*{box-sizing:border-box;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px;}
.col{max-width:520px;margin:0 auto;}
.proto{margin:0 -16px;padding:6px 16px;background:var(--well);color:var(--soft);font-size:.8rem;text-align:center;}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;margin:0 -16px;padding:10px 16px 8px;background:var(--bg);border-bottom:1px solid var(--rule);}
.top .l{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:.9rem;color:var(--soft);}
.top b{color:var(--ink);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;}
.bar{height:8px;border-radius:99px;background:var(--well);margin-top:6px;overflow:hidden;} .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s;}
h1{margin:22px 0 6px;font-size:1.55rem;line-height:1.3;text-wrap:balance;} h2{margin:18px 0 4px;font-size:1.3rem;line-height:1.35;text-wrap:balance;}
.lead{margin:0 0 14px;color:var(--soft);font-size:1rem;}
.list{display:grid;gap:10px;margin:14px 0;padding:0;list-style:none;}
.list li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:10px;align-items:start;font-size:1rem;} .list svg{width:1.4rem;height:1.4rem;margin-top:.15rem;stroke:var(--acc);}
.field{margin:18px 0 6px;} .field label{display:block;font-weight:700;margin-bottom:4px;} .field small{display:block;color:var(--soft);font-size:.9rem;margin-top:4px;}
input[type=text],textarea{width:100%;font:inherit;font-size:1.3rem;padding:12px 14px;border:2px solid var(--rule);border-radius:12px;background:var(--panel);color:var(--ink);}
input#birth{letter-spacing:.4em;font-family:var(--mono);max-width:11rem;}
textarea{font-size:1.05rem;min-height:9rem;resize:vertical;}
.btn{min-height:54px;padding:0 22px;border-radius:14px;border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--acc);} .btn.full{width:100%;} .btn[disabled]{opacity:.55;cursor:not-allowed;}
.short{margin:8px 0 4px;}
.row{margin:12px 0;padding:14px;border:2px solid var(--rule);border-radius:14px;background:var(--panel);scroll-margin-top:96px;}
.row.need{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.row .q b{display:block;font-size:1.12rem;line-height:1.35;} .row .q span{display:block;color:var(--soft);font-size:.95rem;line-height:1.45;margin-top:2px;}
.seg{display:grid;grid-template-columns:1fr 1fr .8fr;gap:8px;margin-top:10px;}
.seg button{min-height:52px;border-radius:12px;border:2px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;font-size:1.08rem;font-weight:500;cursor:pointer;}
.seg button[aria-pressed=true].y{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700;}
.seg button[aria-pressed=true].n{background:var(--no);border-color:var(--no);color:var(--no-ink);font-weight:700;}
.seg button[aria-pressed=true].u{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700;}
.seg button.u{font-size:.95rem;border-style:dashed;}
.more{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule);} .more p{margin:0 0 8px;font-size:1rem;font-weight:500;}
.sev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;} .sev button{min-height:52px;border-radius:12px;border:2px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;line-height:1.25;padding:4px 6px;}
.sev button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);font-weight:700;}
.loc{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule);} .loc p{margin:0 0 6px;font-size:1rem;font-weight:500;}
.fig{display:block;width:100%;max-width:330px;margin:4px auto 8px;height:auto;touch-action:manipulation;}
.fig .blk{cursor:pointer;outline:none;} .fig .blk rect{fill:var(--well);stroke:var(--soft);stroke-width:2;} .fig .blk text{font:500 15px var(--sans);fill:var(--ink);text-anchor:middle;pointer-events:none;}
.fig .blk[aria-pressed=true] rect{fill:var(--acc);stroke:var(--acc);} .fig .blk[aria-pressed=true] text{fill:var(--acc-ink);font-weight:700;}
.fig .blk:focus-visible rect{stroke:var(--focus);stroke-width:4;}
.hint{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.95rem;line-height:1.45;font-weight:500;}
.fig.dim{opacity:.45;} .locsum{margin:8px 0 0;min-height:1.5em;font-size:.95rem;color:var(--soft);}
.locchips{display:flex;flex-wrap:wrap;gap:8px;} .locchips button{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;}
.locchips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700;}
.redblk{margin:12px 0;padding:14px;border:2px solid var(--red);border-radius:14px;background:var(--panel);} .redblk.need{box-shadow:0 0 0 4px var(--red-soft);} .redblk h3{margin:0 0 4px;font-size:1.1rem;} .redblk p{margin:0 0 8px;font-size:.95rem;color:var(--soft);}
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0;} .rr b{display:block;font-size:1rem;line-height:1.3;} .rr .seg{margin:0;grid-template-columns:repeat(3,64px);} .rr .seg button{min-height:48px;font-size:1rem;}
@media (max-width:400px){.rr{grid-template-columns:1fr;} .rr .seg{grid-template-columns:repeat(3,1fr);}}
.confirm{margin:8px 0 4px;padding:12px;border:2px solid var(--acc);border-radius:14px;background:var(--acc-soft);} .confirm p{margin:0 0 8px;font-weight:700;} .confirm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .confirm .btn{padding:0 10px;font-size:1rem;}
.rq{margin-left:6px;color:var(--soft);font-weight:400;}
.qo{grid-template-columns:repeat(2,1fr);margin-top:6px;} .qo button{min-height:52px;font-size:1rem;line-height:1.3;} .qo.q5 button:first-child,.qo.q5 button:last-child{grid-column:auto;}
.alert{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:.95rem;line-height:1.5;font-weight:500;}
.sum{margin:12px 0;padding:14px;border:2px solid var(--rule);border-radius:14px;background:var(--panel);} .sum h3{margin:0 0 6px;font-size:1.05rem;} .sum ul{margin:0;padding-left:1.2rem;} .sum li{margin:2px 0;} .sum .edit{margin-top:8px;min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--rule);background:transparent;color:var(--ink);font:inherit;cursor:pointer;}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
.dock .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;}
.dock .left{display:flex;flex-direction:column;gap:2px;} .dock .remain{font-size:.85rem;color:var(--soft);min-height:1.2em;} .dock .remain.warn{color:var(--red);font-weight:700;}
.lab{margin-top:26px;padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--well);font-size:.9rem;color:var(--soft);} .lab b{color:var(--ink);} .lab pre{white-space:pre-wrap;word-break:break-all;font:.8rem var(--mono);margin:8px 0 0;max-height:12rem;overflow:auto;}
.lab table{border-collapse:collapse;width:100%;margin-top:6px;} .lab td,.lab th{border-bottom:1px solid var(--rule);padding:3px 6px;text-align:left;font-variant-numeric:tabular-nums;}
.done{margin-top:22px;padding:16px;border-radius:14px;background:var(--acc-soft);} .done h1{margin:0 0 6px;}
.safe{margin:12px 0;padding:12px 14px;border-left:5px solid var(--red);background:var(--red-soft);border-radius:8px;font-size:.98rem;}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.95rem;}
@media (prefers-reduced-motion:reduce){.bar i{transition:none;}}
</style>

<div class="proto">原型（位置版）：疼痛、關節、麻、皮疹、癢、照射部位皮膚答「有」時，會展開「在哪裡？」。不會送出任何資料</div>
<div class="top" id="top" hidden><div class="l"><span id="stepName"></span><span><b id="stepNo"></b></span></div><div class="bar" aria-hidden="true"><i id="bar"></i></div></div>
<div class="col" id="app"></div>
<div class="dock" id="dock" hidden><div class="in"><button class="btn ghost" id="back" type="button">上一步</button><div class="left" style="align-items:stretch"><button class="btn" id="next" type="button">下一步</button><span class="remain" id="remain" aria-live="polite"></span></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---- 連結交接（不需伺服器）：資料包 gzip 後放在網址的 #d= 後面；沒有 CompressionStream 時用未壓縮 ---- */
const b64u = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = t => { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; const s = atob(t), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function pack(obj) { const j = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) { try { const cs = new CompressionStream("gzip"), w = cs.writable.getWriter(); w.write(j); w.close(); return "z." + b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer())); } catch (e) {} }
  return "j." + b64u(j); }
async function unpack(s) { s = String(s).trim(); const m = s.match(/#d=([A-Za-z0-9_.\-]+)/); if (m) s = m[1]; else if (s[0] === "{") return JSON.parse(s);
  const u = unb64u(s.slice(2)); if (s[0] === "z") { const ds = new DecompressionStream("gzip"), w = ds.writable.getWriter(); w.write(u); w.close(); return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())); }
  return JSON.parse(new TextDecoder().decode(u)); }
const linkTo = async (page, obj) => new URL(page, location.href).origin + new URL(page, location.href).pathname + "#d=" + await pack(obj);
const copyText = (t, btn) => { const ok = () => { if (btn) btn.textContent = "已複製"; }, fb = () => { const ta = document.querySelector("#lk, #dl"); if (ta) { ta.focus(); ta.select(); } if (btn) btn.textContent = "已選取，請手動複製"; };
  try { navigator.clipboard.writeText(t).then(ok, fb); } catch (e) { fb(); } };

const QS = new URLSearchParams(location.search);
const META = { p: QS.get('p') || '', card: QS.get('card') || '', pid0: QS.get('pid') || '', seed: QS.get('seed') === '1', rand: Math.random().toString(36).slice(2, 6).toUpperCase() };   // 試行用：參與者代號、情境卡、是否在檢視頁翻轉一個紅旗答案（量 q）
/* 暫定題目（化療＋放療的病人）。正式版每個「有」會展開現有題庫該症狀的追問題；這裡只放一題嚴重度。 */
const RED_CORE = [
 {id:"fever",  n:"發燒",       d:"體溫超過 38 度，或一陣冷一陣熱", red:1, nosev:1,
  q:{req:1, title:"有量體溫的話，最高量到幾度？", opts:[["none","沒量，只是覺得發燒"],["lt375","37.5 度以下"],["375_379","37.5–37.9 度"],["38_389","38–38.9 度"],["ge39","39 度以上"]]}},
 {id:"swallow",n:"吞嚥困難",   d:"吞東西會痛、會卡住，連水都吞不下", red:1},
 {id:"breath", n:"喘或咳嗽",   d:"走一小段路就喘，或咳得比平常多", red:1},
 {id:"weight", n:"體重掉很多", d:"最近一週變瘦，衣服變鬆", red:1, nosev:1,
  q:{title:"家裡有磅秤的話，大約掉了幾公斤？（到院時護理會再量一次）", opts:[["none","沒量"],["1_2","1–2 公斤"],["3_4","3–4 公斤"],["5_7","5–7 公斤"],["8_12","8–12 公斤"],["ge13","13 公斤以上"]]}},
 {id:"blood", n:"血便或黏液便", d:"大便帶血，或有黏液", red:1, nosev:1, page:"diarrhea"},
 {id:"hemo",  n:"咳血或吐血", d:"咳出或吐出來的東西帶血", red:1, nosev:1, page:"swallow"},
 {id:"weak",  n:"肌肉沒力", d:"蹲下站不起來、手舉不高", red:1, nosev:1, page:"joint"}];
const RED_TX = [   // 和這次治療有關的安全列（免疫治療、ADC）：題庫的『今日必處理』紅旗依賴這些題
 {id:"chest",  n:"胸悶或胸痛", d:"胸口悶、被壓著，或會痛", red:1, nosev:1, tx:["io"], page:"cardiac"},
 {id:"palp",   n:"心跳很快或不規則", d:"沒在運動卻心跳很快，或跳得很亂", red:1, nosev:1, tx:["io"], page:"cardiac"},
 {id:"dizzy",  n:"站起來會頭暈、眼前發黑", d:"從坐著或躺著站起來的時候", red:1, nosev:1, tx:["io"], page:"endo"},
 {id:"eyepain",n:"眼睛痛、很紅或怕光", d:"眼睛會痛、很紅，或看到光不舒服", red:1, nosev:1, tx:["io","adc"], page:["eye_io","eye_adc"]}];
const GA_ALL = [
 {id:"fatigue", n:"疲倦、沒力氣", d:"比平常容易累，休息也沒有好轉"},
 {id:"nausea",  n:"噁心、吃不下", d:"想吐，或只吃得下很少",
  q:{title:"過去一天吐了幾次？", opts:[["0","沒吐"],["1_2","1–2 次"],["3_5","3–5 次"],["ge6","6 次以上"]]}},
 {id:"diarrhea",n:"拉肚子", d:"一天解很多次，或是水狀的", nosev:1,
  q:{req:1, title:"最近最多的一天，比平常多解幾次？", opts:[["0","沒有比平常多"],["1_3","多 1–3 次"],["4_6","多 4–6 次"],["ge7","多 7 次以上"],["unk","說不準，請護理確認"]]}},
 {id:"constipation",n:"便秘", d:"超過兩天沒有解，或很用力才解得出來", tx:["chemo"]},
 {id:"dehyd",   n:"口乾、尿很少", d:"一直很渴，或尿量明顯變少"},
 {id:"pain",    n:"疼痛", d:"胸口、背、肚子、喉嚨、骨頭等處的痛。手腳關節或肌肉的痠痛，請在下一項回答"},
 {id:"joint",   n:"關節或肌肉痛", d:"手腳關節或肌肉的痠痛，走路、起身或抬手時更明顯"},
 {id:"coldhot", n:"特別怕冷或怕熱", d:"比平常更怕冷，或一直覺得很熱", tx:["io"], page:"endo"},
 {id:"thirst",  n:"很容易口渴、一直跑廁所", d:"一直想喝水，尿很多次", tx:["io"], page:"endo"},
 {id:"swell",   n:"腳腫", d:"腳踝或小腿腫起來", tx:["io"], page:"cardiac"}];
const GB_ALL = [
 {id:"rash",   n:"皮膚起疹子", d:"紅疹、小疙瘩，在身體任何地方"},
 {id:"itch",   n:"皮膚癢", d:"很想抓，影響睡眠或專心"},
 {id:"skin_rt",n:"照射部位的皮膚", d:"放射線照到的地方變紅、痛、脫皮或破皮", tx:["rt"]},
 {id:"mouth",  n:"嘴巴破", d:"口腔有破洞、潰瘍，吃東西會痛", tx:["chemo"]},
 {id:"voice",  n:"聲音沙啞", d:"說話聲音變小、變啞", tx:["rt"]},
 {id:"neuro",  n:"手腳麻、刺痛", d:"手或腳麻麻的、像針刺，或沒力氣", tx:["chemo"]},
 {id:"blur",   n:"視力變模糊", d:"看東西模糊，或有重影", tx:["io","adc"], page:["eye_io","eye_adc"]},
 {id:"dryeye", n:"眼睛乾澀、有異物感", d:"眼睛很乾，像有沙子", tx:["adc"], page:"eye_adc"}];
const RED = [], GA = [], GB = [], ALL = [], STEPS = [];   // 依治療別重建（applyTx）；RED＝所有紅旗列（檢視頁確認區用）
const ITEM = Object.fromEntries([...RED_CORE,...RED_TX,...GA_ALL,...GB_ALL].map(x=>[x.id,x]));
const TXLIST = [["chemo","化療"],["rt","放療"],["io","免疫治療"],["adc","ADC"]];
const vis = x => !x.tx || x.tx.some(t=>S.tx.has(t));
function applyTx(){
  const core = RED_CORE.filter(vis), extra = RED_TX.filter(vis);
  RED.length = GA.length = GB.length = ALL.length = STEPS.length = 0;
  RED.push(...core, ...extra); GA.push(...GA_ALL.filter(vis)); GB.push(...GB_ALL.filter(vis)); ALL.push(...RED, ...GA, ...GB);
  STEPS.push({k:"red", name:"先確認幾件重要的事", items:core, short:false});
  if (extra.length) STEPS.push({k:"red2", name:"和這次治療有關的重要項目", items:extra, short:false});
  STEPS.push({k:"A", name:"身體的感覺", items:GA, short:true}, {k:"B", name:"皮膚與其他", items:GB, short:true}, {k:"note", name:"想告訴醫師的話"}, {k:"review", name:"看一下再送出"});
}
const LOCABLE = new Set(["pain","joint","neuro","rash","itch","skin_rt"]);   // 這幾項答「有」才問位置
const BLK = [["head","頭頸",105,4,90,60],["chest","胸",95,70,110,70],["abd","腹",100,146,100,64],["armR","右手臂",30,70,58,150],["armL","左手臂",212,70,58,150],["legR","右腿",82,216,64,110],["legL","左腿",154,216,64,110]];   // 圖上方塊（病人的右邊在畫面左側）

    const k=key(), st=STEPS[S.i];
    if (st.items){ const un=unanswered(st); if(un.length){ S.needHits++; $$(".row").forEach(r=>r.classList.toggle("need", un.some(x=>x.id===r.dataset.row))); const f=$(`.row[data-row="${un[0].id}"]`); f.scrollIntoView({block:"center",behavior:"smooth"}); const r=$("#remain"); r.textContent=`還有 ${un.length} 項沒選，已標出來`; r.classList.add("warn"); return; } }
    if (k==="review"){ if (performance.now()-S.lastNav<NAV_GAP) return; if (!S.redOk){ S.needHits++; const bl=$("#redblk"); if(bl){ bl.classList.add("need"); bl.scrollIntoView({block:"center",behavior:"smooth"}); } const r=$("#remain"); r.textContent=`請先確認上面 ${RED.length} 個重要項目`; r.classList.add("warn"); return; } leave(); S.done=true; render(); window.scrollTo(0,0); try{ parent.postMessage({type:"submit", payload:exportPayload()}, "*"); }catch(e){} return; }
    go(S.i+1); return; }
  if (b.id==="cplink"){ copyText($("#lk").value, b); return; }
  if (b.id==="shlink"){ try{ navigator.share({ title:"ePRO 試行紀錄", url:$("#lk").value }); }catch(x){} return; }
  if (b.id==="copy"){ try{ navigator.clipboard.writeText($("#json").textContent).then(()=>b.textContent="已複製",()=>b.textContent="請手動選取下方文字"); }catch(x){ b.textContent="請手動選取下方文字"; } }
});
document.addEventListener("keydown", e => { const g = e.target.closest && e.target.closest("g[data-l]"); if (g && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); const [id,k]=g.dataset.l.split("|"); toggleLoc(id,k); const y=scrollY; render(); scrollTo(0,y); } });
document.addEventListener("input", e => { if (e.target.id==="note") S.note = e.target.value; if (e.target.id==="mp") META.p = e.target.value.trim(); if (e.target.id==="mc") META.card = e.target.value.trim().toUpperCase(); });
render();
</script>
